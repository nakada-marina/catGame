<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ぐりおとぽんた｜アニメーション確認</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7ecdb;color:#51372a;font-family:system-ui,sans-serif}header{padding:20px 16px;background:#7b4d32;color:white}h1{font-size:22px;margin:0}p{margin:8px 0}.wrap{max-width:1000px;margin:auto;padding:16px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;background:#fff7ec;border-radius:14px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:#fffaf1;border:2px solid #dfb995;border-radius:16px;padding:12px;text-align:center}.card h2{font-size:16px;margin:0 0 8px}.stage{height:145px;display:flex;align-items:end;justify-content:center;background:linear-gradient(#f3dfc8 72%,#d1a47c 72%);border-radius:10px;overflow:hidden}.stage canvas{width:120px;height:130px;image-rendering:pixelated}label{font-weight:bold}input{accent-color:#a66b45}a{color:#a0552f}small{color:#826a57}</style></head><body><header><h1>🐾 ぐりお・ぽんた アニメーション検査室</h1><p>本番と同じ素材・基準位置で、歩行全コマと表情8種類を確認できます。設定画から切り出した素材と、足先だけを動かす歩行4コマを表示します。毛づくろいは既存ポーズで代用しています。</p></header><main class="wrap"><div class="controls"><label><input type="checkbox" id="play" checked> 再生</label><label>速度 <input id="speed" type="range" min="1" max="12" value="6"></label><label><input id="flip" type="checkbox"> 左右反転</label><small>スプライトの欠け・顔・口・足元をチェック</small></div><div id="grid" class="grid"></div><p><a href="./">← ゲームに戻る</a></p></main><script src="./character-detail.js?v=20261011-native"></script><script src="./character-art.js?v=20261011-native"></script><script>
const items=[];
const names={idle:'待機',sit:'座る',jump:'ジャンプ／喜ぶ',bow:'お辞儀／接客',serve:'配膳',coffee:'調理',cake:'ケーキ',clean:'掃除',surprise:'驚く',sleepbag:'睡眠',box:'段ボール',f_normal:'通常',f_happy:'笑顔',f_kiri:'にっこり',f_surprise:'驚き',f_sleepy:'眠い',f_angry:'怒る',f_tehe:'照れる',f_amae:'甘える'};
let tick=0,last=0;
CatArtwork.load().then(sprites=>{
  for(const who of Object.keys(sprites)) {
    const poses=[['walk', [0,1,2,3].map(i=>sprites[who]['walk'+i])], ...Object.entries(sprites[who]).map(([key,im])=>[key,[im]])];
    for(const [key,frames] of poses){
      const card=document.createElement('section');card.className='card';
      const title=document.createElement('h2');title.textContent=(who==='grio'?'ぐりお':'ぽんた')+'・'+(key==='walk'?'歩行4コマ':key.startsWith('walk')?'歩行コマ '+key.slice(-1):(names[key]||({run:'走る',joy:'喜ぶ'}[key])||key));
      const stage=document.createElement('div');stage.className='stage';
      const cv=document.createElement('canvas');cv.width=160;cv.height=130;cv.style.width='160px';
      stage.append(cv);card.append(title,stage);document.querySelector('#grid').append(card);items.push({key,frames,cv});
    }
  }
}).catch(e=>{document.querySelector('#grid').textContent=e.message;});
function render(now){
  if(document.querySelector('#play').checked&&now-last>180-document.querySelector('#speed').value*10){tick++;last=now;}
  for(const {frames,cv} of items){
    const g=cv.getContext('2d'),im=frames[tick%frames.length];
    g.clearRect(0,0,cv.width,cv.height);g.imageSmoothingEnabled=false;g.save();
    if(document.querySelector('#flip').checked){g.translate(cv.width,0);g.scale(-1,1);}
    const scale=Math.min(2,cv.width/im.width,(cv.height-2)/im.height);
    g.drawImage(im,Math.round((cv.width-im.width*scale)/2),Math.round(cv.height-im.height*scale),Math.round(im.width*scale),Math.round(im.height*scale));g.restore();
    g.fillStyle='#bd9272';g.fillRect(0,129,160,1);
  }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script></body></html>
