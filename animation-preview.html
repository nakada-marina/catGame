<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ぐりおとぽんた｜アニメーション確認</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7ecdb;color:#51372a;font-family:system-ui,sans-serif}header{padding:20px 16px;background:#7b4d32;color:white}h1{font-size:22px;margin:0}p{margin:8px 0}.wrap{max-width:1000px;margin:auto;padding:16px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;background:#fff7ec;border-radius:14px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:#fffaf1;border:2px solid #dfb995;border-radius:16px;padding:12px;text-align:center}.card h2{font-size:16px;margin:0 0 8px}.stage{height:145px;display:flex;align-items:end;justify-content:center;background:linear-gradient(#f3dfc8 72%,#d1a47c 72%);border-radius:10px;overflow:hidden}.stage canvas{width:120px;height:130px;image-rendering:pixelated}label{font-weight:bold}input{accent-color:#a66b45}a{color:#a0552f}small{color:#826a57}</style></head><body><header><h1>🐾 ぐりお・ぽんた アニメーション検査室</h1><p>歩行・待機・接客・掃除・表情を同時に確認できます</p></header><main class="wrap"><div class="controls"><label><input type="checkbox" id="play" checked> 再生</label><label>速度 <input id="speed" type="range" min="1" max="12" value="6"></label><label><input id="flip" type="checkbox"> 左右反転</label><small>スプライトの欠け・顔・口・足元をチェック</small></div><div id="grid" class="grid"></div><p><a href="./">← ゲームに戻る</a></p></main><script>
const meta={grio:{walk:[[0,0,39,58],[41,0,39,58],[82,0,39,58],[123,0,42,58]],idle:[167,0,32,53],sit:[201,0,46,40],jump:[249,0,38,52],bow:[289,0,38,43],serve:[329,0,39,52],coffee:[370,0,36,57],clean:[408,0,39,52],surprise:[449,0,34,48],sleepbag:[0,66,73,39],faces:[[485,0,64,64],[551,0,64,64],[617,0,64,64],[683,0,64,64],[749,0,64,64],[815,0,64,64],[881,0,64,64],[947,0,64,64]]},ponta:{walk:[[75,66,46,58],[123,66,48,57],[173,66,43,57],[218,66,44,57]],idle:[264,66,38,56],sit:[304,66,40,37],jump:[346,66,37,50],bow:[385,66,44,46],serve:[431,66,43,56],cake:[476,66,43,56],clean:[521,66,45,58],surprise:[568,66,40,51],sleepbag:[132,132,58,41],box:[192,132,44,38],faces:[[610,66,64,64],[676,66,64,64],[742,66,64,64],[808,66,64,64],[874,66,64,64],[940,66,64,64],[0,132,64,64],[66,132,64,64]]}};
const names={walk:'歩く（4コマ）',idle:'待機',sit:'座る',jump:'ジャンプ',bow:'お辞儀',serve:'配膳',coffee:'コーヒー',cake:'ケーキ',clean:'掃除',surprise:'驚く',sleepbag:'寝る',box:'段ボール',faces:'表情（8種類）'};
const img=new Image();img.src='./chars.webp';const items=[];for(const who of Object.keys(meta)){for(const [key,rect] of Object.entries(meta[who])){const card=document.createElement('section');card.className='card';const title=document.createElement('h2');title.textContent=(who==='grio'?'ぐりお':'ぽんた')+'・'+names[key];const stage=document.createElement('div');stage.className='stage';const cv=document.createElement('canvas');cv.width=120;cv.height=130;stage.append(cv);card.append(title,stage);document.querySelector('#grid').append(card);items.push({key,rect,cv});}}
let t=0,last=0;function render(now){const playing=document.querySelector('#play').checked;if(playing&&now-last>110-document.querySelector('#speed').value*7){t++;last=now}if(img.complete&&img.naturalWidth){for(const item of items){const g=item.cv.getContext('2d');g.clearRect(0,0,120,130);g.imageSmoothingEnabled=false;const rect=Array.isArray(item.rect[0])?item.rect[(item.key==='walk'?Math.floor(t/3):Math.floor(t/13))%item.rect.length]:item.rect;const [x,y,w,h]=rect;const scale=Math.min(2,110/w,116/h);const dw=Math.round(w*scale),dh=Math.round(h*scale);g.save();if(document.querySelector('#flip').checked){g.translate(120,0);g.scale(-1,1)}g.drawImage(img,x,y,w,h,Math.round((120-dw)/2),126-dh,dw,dh);g.restore();}}requestAnimationFrame(render)}requestAnimationFrame(render);
</script></body></html>
