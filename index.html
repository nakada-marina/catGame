<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1f2e28">
<title>ぐりおのねこカフェ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* 黒板メニューのような深緑 × チョーク色 × 木の色。ひとつの世界観で固定 */
:root {
  --board: #1f2e28;
  --board-2: #2a3d35;
  --chalk: #efe9dc;
  --chalk-dim: #a9b8ad;
  --butter: #f2c14e;
  --wood: #7a5232;
  --wood-hi: #94663f;
  --rose: #e88a9a;
  --bad: #ff8a7a;
  --font: "DotGothic16", "Hiragino Maru Gothic ProN", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--board);
  color: var(--chalk);
  font-family: var(--font);
  display: flex;
  justify-content: center;
  padding-inline: 16px;
  padding-block: 8px;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
#wrap {
  width: min(100%, 640px, calc((100dvh - 150px) * 224 / 300));
  min-width: min(100%, 300px);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
#hud {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 8px 12px;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
}
#hud .day { color: var(--chalk-dim); white-space: nowrap; }
#hud .money { text-align: center; font-size: 18px; color: var(--butter); white-space: nowrap; }
#hud .stars { white-space: nowrap; color: var(--butter); letter-spacing: 1px; }
#hud .stars .off { color: #4a5c53; }
#cafe {
  display: block;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 224 / 300;
  image-rendering: pixelated;
  border: 3px solid #0f1814;
  border-radius: 6px;
  background: #000;
  touch-action: none;
  cursor: pointer;
}
#stage { position: relative; }
#talk {
  position: absolute;
  left: 8px; right: 8px; bottom: 8px;
  display: flex;
  gap: 10px;
  background: rgba(24, 36, 31, 0.95);
  border: 3px solid var(--wood);
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
}
#face {
  width: 30%;
  max-width: 132px;
  aspect-ratio: 1;
  flex-shrink: 0;
  align-self: flex-start;
  image-rendering: pixelated;
  background: #e9dcc0;
  border: 3px solid #5a3a22;
  border-radius: 6px;
}
#talk .msg { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; position: relative; }
#talk .who { color: var(--butter); font-size: 14px; }
#talk p { margin: 0; font-size: 16px; line-height: 1.6; min-height: 4.8em; }
#talk .next { position: absolute; right: 2px; bottom: 0; color: var(--butter); animation: blink 0.9s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #talk .next { animation: none; } }
#actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
button {
  font-family: inherit;
  font-size: 14px;
  color: var(--chalk);
  background: var(--wood);
  border: 0;
  border-bottom: 3px solid #4e321c;
  border-radius: 8px;
  padding: 10px 6px;
  cursor: pointer;
  line-height: 1.25;
}
button:hover { background: var(--wood-hi); }
button:focus-visible { outline: 2px solid var(--butter); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: default; }
button small { display: block; font-size: 11px; color: #e6d3b8; }
#toast {
  position: fixed;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  transform: translateX(-50%);
  background: var(--butter);
  color: #2a1e10;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 15px;
  max-width: calc(100% - 32px);
  text-align: center;
  pointer-events: none;
  z-index: 20;
}
#modal {
  position: fixed;
  inset: 0;
  background: rgba(8, 14, 11, 0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 10;
}
.panel {
  background: var(--board-2);
  border: 3px solid var(--wood);
  border-radius: 10px;
  width: min(100%, 480px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  padding: 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.panel h2 { margin: 0; font-size: 22px; font-weight: normal; color: var(--butter); text-wrap: balance; }
.panel p { margin: 0; line-height: 1.6; font-size: 15px; }
.panel .sub { color: var(--chalk-dim); font-size: 13px; }
.tabs { display: flex; gap: 6px; }
.tabs button { flex: 1; background: #3a4d44; border-bottom-color: #26352e; }
.tabs button.on { background: var(--wood); border-bottom-color: #4e321c; }
.list { display: flex; flex-direction: column; gap: 8px; }
.row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 10px;
  align-items: center;
  background: #24352e;
  border-radius: 8px;
  padding: 10px 12px;
}
.row .name { font-size: 16px; }
.row .desc { font-size: 12px; color: var(--chalk-dim); grid-column: 1; min-width: 0; }
.row button { grid-row: 1 / span 2; grid-column: 2; min-width: 84px; }
.catrow { grid-template-columns: 44px 1fr; }
.catrow canvas { grid-row: 1 / span 5; width: 40px; height: 36px; image-rendering: pixelated; }
.catrow > :not(canvas) { grid-column: 2; }
.stat { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 15px; font-variant-numeric: tabular-nums; }
.stat .plus { color: var(--butter); text-align: right; }
.stat .minus { color: var(--bad); text-align: right; }
.stat .total { border-top: 1px dashed var(--chalk-dim); padding-top: 6px; }
.review { background: #24352e; border-radius: 8px; padding: 8px 12px; font-size: 14px; line-height: 1.5; }
.review .who { color: var(--butter); font-size: 12px; }
.bar { height: 6px; background: #3a4d44; border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--rose); }
.bar.hunger i { background: var(--butter); }
.actions-row { display: flex; gap: 8px; flex-wrap: wrap; }
.actions-row button { flex: 1; min-width: 120px; }
.title-art { display: block; width: 100%; image-rendering: pixelated; border-radius: 6px; }
#sub { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--chalk-dim); gap: 8px; }
#sub span { min-width: 0; }
#sub button { padding: 4px 10px; font-size: 12px; border-bottom-width: 2px; white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="day" id="hudDay">1日目 10:00</div>
    <div class="money" id="hudMoney">¥0</div>
    <div class="stars" id="hudStars" aria-label="ひょうばん"></div>
  </div>
  <div id="stage">
    <canvas id="cafe" aria-label="カフェの店内"></canvas>
    <div id="talk" hidden role="dialog" aria-live="polite">
      <canvas id="face" width="64" height="64" aria-label="ぐりお"></canvas>
      <div class="msg"><span class="who">ぐりお</span><p id="talkText"></p><span class="next" id="talkNext">▼</span></div>
    </div>
  </div>
  <div id="actions">
    <button type="button" id="btnFood">ごはん<small id="foodLeft">のこり 0</small></button>
    <button type="button" id="btnShop">ショップ<small>家具など</small></button>
    <button type="button" id="btnCats">ねこ<small>ようすを見る</small></button>
    <button type="button" id="btnSpeed">はやさ<small id="speedLabel">×1</small></button>
  </div>
  <div id="sub">
    <span>ふきだし＝注文を出す・お皿＝かたづけ・ねこ＝なでる</span>
    <button type="button" id="btnMute">音 ON</button>
  </div>
</div>
<div id="toast" hidden></div>
<div id="modal" hidden><div class="panel" id="panel"></div></div>
<script>
'use strict';
// ================= 画面 =================
const VW = 224, VH = 300, S = 4;
const cv = document.getElementById('cafe');
cv.width = VW * S; cv.height = VH * S;
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
function P(c, x, y, w = 1, h = 1) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function sprite(rows, pal) {
  const w = Math.max(...rows.map(r => r.length)), c = mk(w, rows.length), g = c.getContext('2d');
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) { const col = pal[r[x]]; if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); } } });
  return c;
}
function flipH(c) { const f = mk(c.width, c.height), g = f.getContext('2d'); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); return f; }
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function ellipse(cx, cy, rx, ry, col) {
  ctx.fillStyle = col;
  for (let y = -ry; y <= ry; y++) {
    const hw = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry + 0.0001))));
    ctx.fillRect(cx - hw, cy + y, hw * 2 + 1, 1);
  }
}

// ================= ドット絵：ねこ =================
const CAT_ROWS = {
  sit: [
    '...........o.....o..',
    '..........opo...opo.',
    '..........obpbtbpbo.',
    '..........obbtbtbbo.',
    '..........obbbbbbbo.',
    '..........obebbbebo.',
    '..........obbwpwbbo.',
    '......oooooobwwwbo..',
    '.....obbtbbtbbwwbo..',
    '....obbbtbbbtbbwwo..',
    '....obbbbbbbbbbwwo..',
    '...osbbbbbbbbbbwbo..',
    '...osbbbbbbbbbbbbo..',
    '..o.osbbbbbbbbbbbo..',
    '.obo.ossbbbbbbsso...',
    '.obbooossssssoowwo..',
    '..obbbbbbbbbbbbbbo..',
    '...ooooooooooooooo..',
  ],
  walkA: [
    '..............o.....o.',
    '.............opo...opo',
    '.............obpbtbpbo',
    '..o..........obbtbtbbo',
    '.obo.........obbbbbbbo',
    '.obo..oooooooobebbbebo',
    '..oobbtbbtbbtobbwpwbbo',
    '...obbbtbbbtbbbobwwwbo',
    '...obbbbbbbbbbbbwwwo..',
    '...osbbbbbbbbbbbbwwo..',
    '....ossbbbbbbbbsso....',
    '....obo..obo..obo.obo.',
    '...obo...obo...obo.obo',
    '...oo....oo....oo..oo.',
  ],
  walkB: [
    '..............o.....o.',
    '.............opo...opo',
    '.............obpbtbpbo',
    '..o..........obbtbtbbo',
    '.obo.........obbbbbbbo',
    '.obo..oooooooobebbbebo',
    '..oobbtbbtbbtobbwpwbbo',
    '...obbbtbbbtbbbobwwwbo',
    '...obbbbbbbbbbbbwwwo..',
    '...osbbbbbbbbbbbbwwo..',
    '....ossbbbbbbbbsso....',
    '.....obobo......obobo.',
    '.....obobo......obobo.',
    '.....oo.oo......oo.oo.',
  ],
  sleep: [
    '............o...o...',
    '...........opo.opo..',
    '...oobbtbbtobbbbbbo.',
    '..obbbtbbbtobbbbbbbo',
    '.obbbbbbbbbbbsbbbsbo',
    '.obbbbbbbbbbbbbwpwbo',
    'oobbbbbbbbbbbbbwwwo.',
    'obbsbbbbbbbbbbbbbbo.',
    'obbbossssssssssssso.',
    '.ooo.oooooooooooooo.',
  ],
};
const CAT_PALS = {
  grio:   { o: '#2a2119', b: '#8a7458', t: '#43352a', s: '#6c5a44', w: '#f7f3ec', p: '#eaa0a6', e: '#a9ad3c' },
  mike:   { o: '#5a463a', b: '#fbf6ee', t: '#e8944a', s: '#ddd4c6', w: '#ffffff', p: '#f29bb0', e: '#b8861a' },
  kuro:   { o: '#0c0c12', b: '#2e2e3a', t: '#24242e', s: '#1c1c24', w: '#44445a', p: '#c06a80', e: '#e8c030' },
  shiro:  { o: '#8a8a98', b: '#fbfbfd', t: '#ececf3', s: '#d9d9e3', w: '#ffffff', p: '#f5a0b8', e: '#4a8ad0' },
  chacha: { o: '#5a3010', b: '#f0a050', t: '#c86e24', s: '#d98a3c', w: '#fff2dc', p: '#f29bb0', e: '#3f7a32' },
};
const CAT_SPR = {};
for (const pal in CAT_PALS) {
  CAT_SPR[pal] = {};
  for (const pose in CAT_ROWS) { const s = sprite(CAT_ROWS[pose], CAT_PALS[pal]); CAT_SPR[pal][pose] = [s, flipH(s)]; }
}

// ================= ドット絵：お客さん =================
const PERSON_TOP_SHORT = [
  '...oooooo...', '..ohhhhhho..', '.ohhhhhhhho.', '.ohhhhhhhho.', '.ohkkkkkkho.', '.okkekkekko.',
  '.okkkkkkkko.', '..okrkkrko..', '...okkkko...', '..osssssso..', '.osssssssso.', 'okssssssssko',
  'okssssssssko', '.odssssssdo.',
];
const PERSON_TOP_LONG = [
  '...oooooo...', '..ohhhhhho..', '.ohhhhhhhho.', '.ohhhhhhhho.', 'ohhkkkkkkhho', 'ohkkekkekkho',
  'ohkkkkkkkkho', 'ohokrkkrkoho', 'ohhokkkkohho', '.ohssssssho.', '.osssssssso.', 'okssssssssko',
  'okssssssssko', '.odssssssdo.',
];
const LEGS_A = ['..oppppppo..', '..opp..ppo..', '..opp..ppo..', '..off..ffo..', '...oo..oo...'];
const LEGS_B = ['..oppppppo..', '..opp..ppo..', '..off..ppo..', '...oo..ffo..', '........oo..'];
const LOOKS = {
  hair: ['#2a1e18', '#5a3a22', '#8a5a2a', '#d8b060', '#3a3a44', '#a04a3a', '#6a6a7a'],
  skin: ['#f8dcc0', '#eebc94', '#c8936a'],
  shirt: ['#e07a7a', '#7aa0e0', '#80c080', '#e0c060', '#b080d0', '#f2f2f2', '#e09050', '#5ab0b0'],
  pants: ['#3a4a6a', '#4a3a2a', '#2a2a30', '#6a6a7a', '#8a6a4a'],
};
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const m = v => clamp(Math.round(v * f), 0, 255).toString(16).padStart(2, '0');
  return '#' + m(r) + m(g) + m(b);
}
function makePerson(look) {
  const pal = { o: '#2a2220', h: look.hair, k: look.skin, e: '#2a2a2a', r: '#e8a0a0', s: look.shirt, d: shade(look.shirt, 0.75), p: look.pants, f: '#3a2a20' };
  const top = look.long ? PERSON_TOP_LONG : PERSON_TOP_SHORT;
  return { a: sprite(top.concat(LEGS_A), pal), b: sprite(top.concat(LEGS_B), pal), sit: sprite(top, pal) };
}
function randomLook() {
  return { hair: pick(LOOKS.hair), skin: pick(LOOKS.skin), shirt: pick(LOOKS.shirt), pants: pick(LOOKS.pants), long: Math.random() < 0.45 };
}
const STAFF_SPR = (() => {
  const pal = { o: '#2a2220', h: '#3a2a20', k: '#f8dcc0', e: '#2a2a2a', r: '#e8a0a0', s: '#f4f0e8', d: '#c86a4a', p: '#3a3a44', f: '#3a2a20' };
  const top = PERSON_TOP_SHORT.slice(0, 11).concat(['okddddddddko', 'okddddddddko', '.oddddddddo.']);
  return sprite(top.concat(LEGS_A), pal);
})();

// ================= ドット絵：メニューと小物 =================
const ICON_DEFS = {
  coffee: [['..g..g..', '...g..g.', 'oooooo..', 'owccwooo', 'occcco.o', 'occccoo.', '.oooo...', 'oooooooo'],
    { o: '#5a3a2a', c: '#7a4426', w: '#f4e4d0', g: '#d8d8e0' }],
  cookie: [['........', '.o....o.', 'oco..oco', 'occcccco', 'ocdccdco', 'occddcco', '.occcco.', '..oooo..'],
    { o: '#6a3a1a', c: '#dcaa60', d: '#6a3a1a' }],
  tea: [['..oooo..', '.owwwwo.', '.ommmmo.', '.ommmmo.', '.ommmmo.', '.obbbbo.', '.ommmmo.', '..oooo..'],
    { o: '#6a4a3a', w: '#ffffff', m: '#d9b48c', b: '#b88a62' }],
  cake: [['....r...', '...ooo..', '..owwwo.', '.owwwwwo', 'oppppppo', 'oyyyyyyo', 'oooooooo', '........'],
    { o: '#a06040', r: '#e02040', w: '#fff8f0', p: '#f8a0b0', y: '#f6d48a' }],
  pancake: [['...yy...', '..oooo..', '.ommmmo.', 'oddddddo', '.ommmmo.', 'oddddddo', '.oooooo.', 'gggggggg'],
    { o: '#8a5020', y: '#fff080', m: '#f0c070', d: '#c88838', g: '#e0e0e8' }],
  omurice: [['........', '..oooo..', '.oyyyyo.', 'oyryyryo', 'oyyrryyo', '.oyyyyo.', 'gggggggg', '........'],
    { o: '#c09020', y: '#f8d040', r: '#d03030', g: '#e8e8f0' }],
  parfait: [['...rr...', '..owwo..', '.owwwwo.', '.oppppo.', '..owco..', '..ocwo..', '...oo...', '..oooo..'],
    { o: '#8a8aa0', r: '#e02040', w: '#fffaf2', p: '#f8a0b8', c: '#8a5a3a' }],
};
const ICON = {};
for (const k in ICON_DEFS) ICON[k] = sprite(ICON_DEFS[k][0], ICON_DEFS[k][1]);
const HEART = sprite(['.oo.oo.', 'orrorro', 'orrrrro', '.orrro.', '..oro..', '...o...'], { o: '#a0304a', r: '#ff7a9a' });
const FUR = sprite(['..o.o..', '.ogogo.', 'oggggg.', '.ogggo.', '..o.o..'], { o: '#9a9aa6', g: '#d6d6de' });
const PLATE = sprite(['..ooooo..', '.owwwwwo.', 'owwcwwcwo', '.owwwwwo.', '..ooooo..'], { o: '#8a8a9a', w: '#f4f4f8', c: '#b88a5a' });

// ================= データ =================
const MENU = [
  { id: 'coffee', name: 'コーヒー', price: 400, unlock: 0 },
  { id: 'cookie', name: 'ねこクッキー', price: 300, unlock: 0 },
  { id: 'tea', name: 'ミルクティー', price: 500, unlock: 3000 },
  { id: 'cake', name: 'いちごケーキ', price: 700, unlock: 6000 },
  { id: 'pancake', name: 'パンケーキ', price: 900, unlock: 10000 },
  { id: 'omurice', name: 'ねこオムライス', price: 1200, unlock: 16000 },
  { id: 'parfait', name: 'にくきゅうパフェ', price: 1500, unlock: 24000 },

const FURNITURE = [
  { id: 'table', name: 'テーブル席', price: 5000, max: 6, desc: 'お客さんの席が2つふえる' },
  { id: 'cushion', name: 'ねこクッション', price: 1500, max: 4, desc: 'ねこがお昼寝できる。ごきげんUP' },
  { id: 'tower', name: 'キャットタワー', price: 8000, max: 1, desc: 'ねこが大よろこび。ごきげんUP' },
  { id: 'plant', name: 'かんようしょくぶつ', price: 2500, max: 3, desc: 'おしゃれ度 +1', decor: 1 },
  { id: 'rug', name: 'まるいラグ', price: 3500, max: 1, desc: 'おしゃれ度 +2', decor: 2 },
  { id: 'shelf', name: 'ほんだな', price: 4500, max: 1, desc: 'おしゃれ度 +2', decor: 2 },
  { id: 'lamp', name: 'ペンダントライト', price: 6000, max: 1, desc: 'おしゃれ度 +3。夕方がきれいに', decor: 3 },
];
const ADOPT = [
  { name: 'ミケ', pal: 'mike', price: 3000, star: 1, desc: 'あまえんぼうの三毛ねこ' },
  { name: 'クロ', pal: 'kuro', price: 5000, star: 2, desc: 'クールな黒ねこ' },
  { name: 'シロ', pal: 'shiro', price: 7000, star: 3, desc: 'おっとりした白ねこ' },
  { name: 'チャチャ', pal: 'chacha', price: 9000, star: 4, desc: 'げんきな茶トラ' },
];
const STAFF = { price: 10000, wage: 2000, star: 2 };
const RENT = 1000, FOOD_PRICE = 500, FOOD_AMOUNT = 8;
const OPEN = 600, CLOSE = 1140; // 10:00〜19:00
const TABLE_POS = [[54, 140], [114, 140], [54, 206], [114, 206], [184, 156], [186, 230]];
const CUSHION_POS = [[22, 270], [50, 288], [176, 288], [204, 270]];
const PLANT_POS = [[70, 74], [124, 74], [214, 296]];
const TOWER = { x: 12, base: 116, top: 58 };
const BOWL = { x: 150, y: 104 };
const ENTRANCE = { x: 112, y: 312 };
const SAVE_KEY = 'grio-cafe-v1';

// ================= 状態 =================
let G = null;            // セーブされる進行データ
let seats = [], customers = [], cats = [], particles = [], furs = [];
let tick = 0, speed = 1, mode = 'title', spawnTimer = 200, staffBusy = 0;
let dayLog = null, weather = 'sun', dayFlags = {}, rushUntil = 0, vipNext = false;

function newSave() {
  return {
    day: 1, money: 8000, pop: 10, bowl: 6, staff: false, served: 0, legend: false,
    furniture: { table: 2, cushion: 0, tower: 0, plant: 0, rug: 0, shelf: 0, lamp: 0 },
    menu: ['coffee', 'cookie'], flags: {},

let actx = null, master = null, muted = false;
function initAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    actx = new AC(); master = actx.createGain(); master.gain.value = muted ? 0 : 0.1; master.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
}
function toneAt(f, d, type, v, at, slide) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, at);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, at + d);
  g.gain.setValueAtTime(0.0001, at); g.gain.linearRampToValueAtTime(v, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + d);
  o.connect(g); g.connect(master); o.start(at); o.stop(at + d + 0.05);
}
const tone = (f, d, type = 'sine', v = 0.5, slide = null, delay = 0) => actx && toneAt(f, d, type, v, actx.currentTime + delay, slide);
const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
const sfx = {
  coin() { tone(1319, 0.08, 'square', 0.25); tone(1760, 0.25, 'square', 0.25, null, 0.07); },
  serve() { tone(784, 0.1, 'triangle', 0.6); tone(1047, 0.18, 'triangle', 0.6, null, 0.08); },
  meow() { tone(760, 0.28, 'sawtooth', 0.18, 470); tone(520, 0.12, 'triangle', 0.3, 640, 0.02); },
  pet() { tone(330, 0.3, 'triangle', 0.5, 300); tone(990, 0.12, 'sine', 0.3, null, 0.12); },
  clean() { tone(2093, 0.05, 'square', 0.15); tone(2637, 0.08, 'square', 0.15, null, 0.05); },
  angry() { tone(220, 0.25, 'sawtooth', 0.25, 150); },
  buy() { [72, 76, 79, 84].forEach((n, i) => tone(mtof(n), 0.18, 'triangle', 0.5, null, i * 0.07)); },
  bell() { [84, 79, 76, 72].forEach((n, i) => tone(mtof(n), 0.5, 'sine', 0.4, null, i * 0.18)); },
};
// ゆったりしたオリジナルBGM（F - Dm - B♭ - C のアルペジオ）
const CHORDS = [[53, 57, 60, 64], [50, 57, 62, 65], [46, 53, 58, 62], [48, 55, 60, 64]];
let bgmOn = false, bgmNext = 0, bgmStep = 0;
setInterval(() => {
  if (!bgmOn || !actx || isPaused()) return;
  const now = actx.currentTime, step = 0.32;
  if (bgmNext < now) bgmNext = now + 0.05;
  while (bgmNext < now + 0.3) {
    const ch = CHORDS[Math.floor(bgmStep / 8) % 4], i = bgmStep % 8;
    if (i === 0) toneAt(mtof(ch[0] - 12), step * 7, 'triangle', 0.35, bgmNext);
    const arp = [1, 2, 3, 2, 1, 2, 3, 2][i];
    toneAt(mtof(ch[arp] + 12), step * 1.6, 'sine', i % 2 ? 0.12 : 0.18, bgmNext);
    bgmNext += step; bgmStep++;
  }
}, 80);

function freeSeats() { return seats.filter(s => !s.cust && !s.dirty); }

function chooseOrder() {
  const items = MENU.filter(m => G.menu.includes(m.id));
  const weights = items.map((m, i) => 1 + i * 0.6);
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < items.length; i++) { r -= weights[i]; if (r <= 0) return items[i]; }
  return items[0];
}
function moveTo(e, tx, ty, sp) {
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
  if (d <= sp) { e.x = tx; e.y = ty; return true; }
  e.x += dx / d * sp; e.y += dy / d * sp; if (Math.abs(dx) > 0.5) e.face = dx > 0 ? 1 : -1; return false;
}
const catNear = seat => cats.some(k => k.visit === seat && k.state === 'visit');

function updateCustomer(c) {

  } else if (c.state === 'sit') {

}
function pay(c) {
  const s = c.seat, item = c.order;
  const wait = 1 - c.patAtServe / c.maxPat;
  let sat = 52 + decor() * 2.5 + Math.min(3, c.visits) * 9 + (avgMood() - 50) * 0.25 - wait * 34 - furs.length * 2.5;

// ================= ねこ =================
function catThink(k) {
  const r = Math.random();
  if (k.hunger > 60 && G.bowl > 0) { k.state = 'toBowl'; k.tx = BOWL.x + rnd(-6, 6); k.ty = BOWL.y + 6; return; }
  const guests = seats.filter(s => s.cust && (s.cust.state === 'order' || s.cust.state === 'eat') && !cats.some(o => o !== k && o.visit === s));
  if (guests.length && r < 0.35) { const s = pick(guests); k.visit = s; k.state = 'toVisit'; k.tx = s.tx + s.side * 14; k.ty = s.ty + 10; return; }
  const freeCush = CUSHION_POS.slice(0, G.furniture.cushion).filter(p => !cats.some(o => o.spot === p));
  if (freeCush.length && r < 0.55) { const p = pick(freeCush); k.spot = p; k.state = 'toSpot'; k.tx = p[0]; k.ty = p[1] - 1; return; }
  if (G.furniture.tower && r < 0.68 && !cats.some(o => o.spot === TOWER)) { k.spot = TOWER; k.state = 'toSpot'; k.tx = TOWER.x + 10; k.ty = TOWER.base + 2; return; }
  if (r < 0.9) { k.state = 'walk'; k.tx = rnd(14, 210); k.ty = rnd(104, 288); return; }
  k.state = 'idle'; k.t = Math.floor(rnd(120, 300));
}
function updateCat(k) {
  k.hunger = clamp(k.hunger + 0.018, 0, 100);
  if (k.hunger > 80) k.mood = clamp(k.mood - 0.012, 0, 100);
  if (k.petCool > 0) k.petCool--;
  const sp = 0.45;
  switch (k.state) {
    case 'idle': if (--k.t <= 0) catThink(k); break;
    case 'walk': k.anim++; if (moveTo(k, k.tx, k.ty, sp)) { k.state = 'idle'; k.t = Math.floor(rnd(90, 260)); } break;
    case 'toBowl':
      k.anim++;
      if (moveTo(k, k.tx, k.ty, sp)) {
        if (G.bowl > 0) { G.bowl--; k.state = 'eat'; k.t = 200; updateFoodLabel(); } else { k.state = 'idle'; k.t = 100; }
      }
      break;
    case 'eat': if (--k.t <= 0) { k.hunger = 0; k.mood = clamp(k.mood + 6, 0, 100); k.state = 'idle'; k.t = 60; } break;
    case 'toVisit':
      k.anim++;
      if (!k.visit.cust) { k.visit = null; k.state = 'idle'; k.t = 30; break; }
      if (moveTo(k, k.tx, k.ty, sp)) { k.state = 'visit'; k.t = Math.floor(rnd(280, 460)); k.visit.cust.visits++; k.face = -k.visit.side; addFx('heart', k.x, k.y - 22); }
      break;
    case 'visit':
      if (--k.t <= 0 || !k.visit.cust) { k.visit = null; k.state = 'idle'; k.t = 40; }
      break;
    case 'toSpot':
      k.anim++;
      if (moveTo(k, k.tx, k.ty, sp)) {
        k.state = 'nap'; k.t = Math.floor(rnd(500, 900));
        if (k.spot === TOWER) { k.jump = 16; k.x = TOWER.x + 10; k.y = TOWER.top + 2; }
      }
      break;
    case 'nap':
      k.mood = clamp(k.mood + (k.spot === TOWER ? 0.012 : 0.008), 0, 100);
      if (k.jump > 0) k.jump--;
      if (--k.t <= 0) {
        if (k.spot === TOWER) { k.x = TOWER.x + 12; k.y = TOWER.base + 4; }
        k.spot = null; k.state = 'idle'; k.t = 60;
      }
      break;
  }
  if (Math.random() < 0.00035 && furs.length < 10 && k.state !== 'nap') furs.push({ x: Math.round(k.x + rnd(-6, 6)), y: Math.round(k.y + rnd(-2, 3)) });
}
function petCat(k) {
  if (k.petCool > 0) { k.mood = clamp(k.mood + 1, 0, 100); addFx('heart', k.x, k.y - 22, { life: 30 }); return; }
  k.mood = clamp(k.mood + 12, 0, 100); k.petCool = 300;
  addFx('heart', k.x - 4, k.y - 22); addFx('heart', k.x + 4, k.y - 26, { t: -10 });

  Math.random() < 0.5 ? sfx.meow() : sfx.pet();
}

function render() {
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = false;

  } else if (kind === 'm') {
    const m = MENU.find(x => x.id === key); if (G.money < m.unlock || G.menu.includes(key)) return;

function canvasPoint(e) {

const FACE_C = {
  fur: '#8c765a', furL: '#a68d6b', furD: '#6a5640', stripe: '#3e3024', line: '#241a12', white: '#f8f4ec', whiteS: '#ddd5c9',
  earIn: '#e2a39c', earInD: '#c07e7a', eye: '#b9bb4a', eyeD: '#7f8b2c', pupil: '#16140e', nose: '#e7969c', noseD: '#b86870', blush: '#efb0a8',
};
function makePortrait(expr) {
  const N = 64, C = FACE_C, buf = Array.from({ length: N }, () => Array(N).fill(null));
  const set = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < N && y < N) buf[y][x] = c; };
  const ell = (x, y, cx, cy, rx, ry) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1;
  const tri = (x, y, a, b, c) => {
    const sg = (p, q, r) => (p[0] - r[0]) * (q[1] - r[1]) - (q[0] - r[0]) * (p[1] - r[1]);
    const d1 = sg([x, y], a, b), d2 = sg([x, y], b, c), d3 = sg([x, y], c, a);
    return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
  };
  const line = (x0, y0, x1, y1, c) => { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)); for (let i = 0; i <= n; i++) set(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, c); };
  const each = fn => { for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) fn(x + 0.5, y + 0.5, x, y); };
  const furAt = (x, y) => ((x * 7 + y * 13) % 17 === 0 ? C.furL : (x * 5 + y * 11) % 19 === 0 ? C.furD : C.fur);
  // 体と白い胸
  each((fx, fy, x, y) => { if (ell(fx, fy, 32, 76, 29, 22)) buf[y][x] = ell(fx, fy, 32, 70, 12, 16) ? C.white : furAt(x, y); });
  // 耳
  const earL = [[6, 3], [27, 17], [12, 32]], earR = [[58, 3], [37, 17], [52, 32]];
  const earLi = [[9, 8], [23, 18], [14, 28]], earRi = [[55, 8], [41, 18], [50, 28]];
  each((fx, fy, x, y) => {
    if (tri(fx, fy, ...earL) || tri(fx, fy, ...earR)) buf[y][x] = C.furD;
    if (tri(fx, fy, ...earLi) || tri(fx, fy, ...earRi)) buf[y][x] = (x * 3 + y) % 7 === 0 ? C.earInD : C.earIn;
  });
  // 頭
  each((fx, fy, x, y) => {
    if (ell(fx, fy, 32, 35, 23, 19) || ell(fx, fy, 32, 43, 26, 12)) {
      let c = furAt(x, y);
      if (ell(fx, fy, 27, 25, 12, 7)) c = (x + y) % 4 === 0 ? C.fur : C.furL;
      if (fy > 51) c = C.furD;
      buf[y][x] = c;
    }
  });
  // しま模様（おでこの M と ほっぺ）
  [[29, 18, 28, 29], [32, 17, 32, 28], [35, 18, 36, 29], [25, 21, 23, 28], [39, 21, 41, 28]].forEach(a => line(...a, C.stripe));
  [[6, 37, 15, 35], [6, 42, 15, 40], [58, 37, 49, 35], [58, 42, 49, 40], [15, 40, 11, 45], [49, 40, 53, 45]].forEach(a => line(...a, C.stripe));
  line(12, 29, 9, 34, C.stripe); line(52, 29, 55, 34, C.stripe);
  // 白いマズル
  each((fx, fy, x, y) => {
    if (ell(fx, fy, 27.5, 47.5, 7, 5) || ell(fx, fy, 36.5, 47.5, 7, 5) || ell(fx, fy, 32, 51, 9, 5)) buf[y][x] = fy > 53 ? C.whiteS : C.white;
  });
  // 目
  for (const cx of [21.5, 42.5]) {
    const cy = 36;
    if (expr === 'happy') {
      for (let dx = -5; dx <= 5; dx++) { const dy = Math.round(Math.sqrt(1 - (dx / 5.5) ** 2) * 3); set(cx + dx, cy + 1 - dy, C.line); set(cx + dx, cy + 2 - dy, C.line); }
      for (let dx = -2; dx <= 2; dx++) set(cx + dx, cy + 6, C.blush);
      continue;
    }
    const big = expr === 'surprise', rx = big ? 6.2 : 5.6, ry = big ? 5.4 : 4.4;
    each((fx, fy, x, y) => {
      if (ell(fx, fy, cx, cy, rx + 1, ry + 1) && !ell(fx, fy, cx, cy, rx, ry)) buf[y][x] = C.line;
      else if (ell(fx, fy, cx, cy, rx, ry)) {
        buf[y][x] = fy < cy - 1 ? C.eyeD : C.eye;
        if (ell(fx, fy, cx + 0.5, cy + 0.3, big ? 1.8 : 1.6, big ? 1.8 : 3.4)) buf[y][x] = C.pupil;
      }
    });
    set(cx - 2, cy - 2, '#ffffff'); set(cx - 1, cy - 2, '#ffffff'); set(cx - 2, cy - 1, '#ffffff'); set(cx + 2, cy + 2, '#fffbe0');
    if (expr === 'sad') {
      each((fx, fy, x, y) => { if (ell(fx, fy, cx, cy, rx + 1, ry + 1) && fy < cy - 0.5) buf[y][x] = C.furD; });
      line(cx - 6, cy - 1, cx + 6, cy - 1, C.line);
      line(cx < 32 ? cx - 6 : cx + 6, cy - 6, cx < 32 ? cx + 2 : cx - 2, cy - 8, C.stripe);
    }
  }
  // 鼻と口
  each((fx, fy, x, y) => { if (tri(fx, fy, [28.5, 42.5], [35.5, 42.5], [32, 46.5])) buf[y][x] = fy < 43.5 ? C.noseD : C.nose; });
  set(31, 47, C.line); set(31, 48, C.line);
  if (expr === 'happy' || expr === 'surprise') {
    each((fx, fy, x, y) => { if (ell(fx, fy, 31.5, 50.5, 2.6, 2)) buf[y][x] = '#c85a64'; });
  } else {
    [[30, 49], [29, 49], [28, 48], [32, 49], [33, 49], [34, 48]].forEach(([x, y]) => set(x, y, C.line));
  }
  // ふちどり
  const out = buf.map(r => r.slice());
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (buf[y][x]) continue;
    if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => buf[y + dy] && buf[y + dy][x + dx])) out[y][x] = C.line;
  }
  // ひげ
  [[20, 47, 3, 44], [20, 49, 2, 50], [21, 51, 5, 55], [43, 47, 60, 44], [43, 49, 61, 50], [42, 51, 58, 55]].forEach(([x0, y0, x1, y1]) => {
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
    for (let i = 0; i <= n; i++) { const x = Math.round(x0 + (x1 - x0) * i / n), y = Math.round(y0 + (y1 - y0) * i / n); if (x >= 0 && x < N && y >= 0 && y < N) out[y][x] = '#fffaf0'; }
  });
  const c = mk(N, N), g = c.getContext('2d');
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (out[y][x]) { g.fillStyle = out[y][x]; g.fillRect(x, y, 1, 1); }
  return c;
}
const FACES = {};
['normal', 'happy', 'sad', 'surprise'].forEach(e => { FACES[e] = makePortrait(e); });

// ================= 会話 =================
const TALKS = {

  star3: [['surprise', '★3！ まちで うわさに なってきたにゃ。'], ['happy', 'シロも あそびに 来たいって。ショップを 見てみてね。']],
  star4: [['happy', '★4 だにゃ！ チャチャが なかまに なりたいって。']],
  star5: [['surprise', '★5！！ まちいちばんの ねこカフェ だにゃ！'], ['happy', 'あとは もちきん ¥100,000 を めざそう！']],
  legend: [['surprise', 'やったにゃ……！ でんせつの ねこカフェに なったよ！'], ['happy', 'オーナーさん、ほんとうに ありがとう。これからも よろしくにゃ！']],
  rush: [['surprise', 'たいへん！ SNSで おみせが 話題に なってるにゃ！'], ['happy', 'しばらく お客さんが いっぱい 来るよ。がんばろう！']],
  vip: [['surprise', 'あっ、つぎの お客さんは ねこ好きで ゆうめいな 常連さん！'], ['happy', '王冠の お客さんに はやく はこぶと、チップを たくさん くれるにゃ。']],
  toy: [['happy', 'ねこじゃらしを みつけたにゃ！'], ['happy', 'みんなで あそんで、ごきげんに なったよ〜']],
};
const talkQ = [];
let talking = null, typeTimer = 0;
function say(lines, onDone) { talkQ.push({ lines, onDone }); }
function event(key) { if (!G || G.flags[key]) return; G.flags[key] = true; say(TALKS[key]); }
function startTalk() {
  talking = { ...talkQ.shift(), i: 0 };
  $('talk').hidden = false; showLine();
}
function showLine() {
  const [face, text] = talking.lines[talking.i];
  const g = $('face').getContext('2d'); g.clearRect(0, 0, 64, 64); g.drawImage(FACES[face], 0, 0);
  talking.text = text; talking.shown = 0; $('talkNext').hidden = true;
  clearInterval(typeTimer);
  typeTimer = setInterval(() => {
    talking.shown++;
    $('talkText').textContent = text.slice(0, talking.shown);
    if (talking.shown % 2 === 0 && text[talking.shown - 1] !== ' ') tone(700 + Math.random() * 300, 0.03, 'square', 0.06);
    if (talking.shown >= text.length) { clearInterval(typeTimer); $('talkNext').hidden = false; }
  }, 38);
}
function advanceTalk() {
  if (!talking) return;
  if (talking.shown < talking.text.length) { clearInterval(typeTimer); talking.shown = talking.text.length; $('talkText').textContent = talking.text; $('talkNext').hidden = false; return; }
  if (++talking.i < talking.lines.length) { showLine(); return; }

  if (done) done();
}

addEventListener('keydown', e => { if (talking && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); advanceTalk(); } });
function checkEvents() {
  if (dayLog.angry > 0) event('firstAngry');

  if (!dayFlags.hungry && G.bowl === 0 && cats.some(k => k.hunger > 85)) { dayFlags.hungry = true; say(TALKS.hungry); }
  for (const n of [2, 3, 4, 5]) if (stars() >= n) event('star' + n);

}

let last = performance.now(), acc = 0, hudT = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) {
    if (!isPaused()) for (let i = 0; i < speed; i++) update();
    acc -= 1000 / 60;
  }
  if (!talking && talkQ.length && $('modal').hidden) startTalk();
  render();
  if (++hudT % 10 === 0) updateHud();
  requestAnimationFrame(loop);
}

const start = () => requestAnimationFrame(t => { last = t; loop(t); });
