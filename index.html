<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1f2e28">
<title>ぐりおのねこカフェ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* 黒板メニューのような深緑 × チョーク色 × 木の色。ひとつの世界観で固定 */
:root {
  --board: #1f2e28;
  --board-2: #2a3d35;
  --chalk: #efe9dc;
  --chalk-dim: #a9b8ad;
  --butter: #f2c14e;
  --wood: #7a5232;
  --wood-hi: #94663f;
  --rose: #e88a9a;
  --bad: #ff8a7a;
  --font: "DotGothic16", "Hiragino Maru Gothic ProN", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--board);
  color: var(--chalk);
  font-family: var(--font);
  display: flex;
  justify-content: center;
  padding-inline: 16px;
  padding-block: 8px;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
#wrap {
  width: min(100%, 640px, calc((100dvh - 230px) * 224 / 300));
  min-width: min(100%, 300px);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
#hud {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 8px 12px;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
}
#hud .day { color: var(--chalk-dim); white-space: nowrap; }
#hud .money { text-align: center; font-size: 18px; color: var(--butter); white-space: nowrap; }
#hud .stars { white-space: nowrap; color: var(--butter); letter-spacing: 1px; }
#hud .stars .off { color: #4a5c53; }
#cafe {
  display: block;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 224 / 300;
  image-rendering: pixelated;
  border: 3px solid #0f1814;
  border-radius: 6px;
  background: #000;
  touch-action: none;
  cursor: pointer;
}
#stage { position: relative; }
#talk {
  position: absolute;
  left: 8px; right: 8px; bottom: 8px;
  display: flex;
  gap: 10px;
  background: rgba(24, 36, 31, 0.95);
  border: 3px solid var(--wood);
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
}
#face {
  width: 30%;
  max-width: 132px;
  aspect-ratio: 1;
  flex-shrink: 0;
  align-self: flex-start;
  image-rendering: pixelated;
  background: #e9dcc0;
  border: 3px solid #5a3a22;
  border-radius: 6px;
}
#talk .msg { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; position: relative; }
#talk .who { color: var(--butter); font-size: 14px; }
#talk p { margin: 0; font-size: 16px; line-height: 1.6; min-height: 4.8em; }
#talk .next { position: absolute; right: 2px; bottom: 0; color: var(--butter); animation: blink 0.9s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #talk .next { animation: none; } }
#actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
button {
  font-family: inherit;
  font-size: 14px;
  color: var(--chalk);
  background: var(--wood);
  border: 0;
  border-bottom: 3px solid #4e321c;
  border-radius: 8px;
  padding: 10px 6px;
  cursor: pointer;
  line-height: 1.25;
}
button:hover { background: var(--wood-hi); }
button:focus-visible { outline: 2px solid var(--butter); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: default; }
button small { display: block; font-size: 11px; color: #e6d3b8; }
#toast {
  position: fixed;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  transform: translateX(-50%);
  background: var(--butter);
  color: #2a1e10;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 15px;
  max-width: calc(100% - 32px);
  text-align: center;
  pointer-events: none;
  z-index: 20;
}
#modal {
  position: fixed;
  inset: 0;
  background: rgba(8, 14, 11, 0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 10;
}
.panel {
  background: var(--board-2);
  border: 3px solid var(--wood);
  border-radius: 10px;
  width: min(100%, 480px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  padding: 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.panel h2 { margin: 0; font-size: 22px; font-weight: normal; color: var(--butter); text-wrap: balance; }
.panel p { margin: 0; line-height: 1.6; font-size: 15px; }
.panel .sub { color: var(--chalk-dim); font-size: 13px; }
.tabs { display: flex; gap: 6px; }
.tabs button { flex: 1; background: #3a4d44; border-bottom-color: #26352e; }
.tabs button.on { background: var(--wood); border-bottom-color: #4e321c; }
.list { display: flex; flex-direction: column; gap: 8px; }
.row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 10px;
  align-items: center;
  background: #24352e;
  border-radius: 8px;
  padding: 10px 12px;
}
.row .name { font-size: 16px; }
.row .desc { font-size: 12px; color: var(--chalk-dim); grid-column: 1; min-width: 0; }
.row button { grid-row: 1 / span 2; grid-column: 2; min-width: 84px; }
.catrow { grid-template-columns: 44px 1fr; }
.catrow canvas { grid-row: 1 / span 5; width: 44px; height: 40px; image-rendering: pixelated; }
.catrow > :not(canvas) { grid-column: 2; }
.stat { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 15px; font-variant-numeric: tabular-nums; }
.stat .plus { color: var(--butter); text-align: right; }
.stat .minus { color: var(--bad); text-align: right; }
.stat .total { border-top: 1px dashed var(--chalk-dim); padding-top: 6px; }
.review { background: #24352e; border-radius: 8px; padding: 8px 12px; font-size: 14px; line-height: 1.5; }
.review .who { color: var(--butter); font-size: 12px; }
.bar { height: 6px; background: #3a4d44; border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--rose); }
.bar.hunger i { background: var(--butter); }
.actions-row { display: flex; gap: 8px; flex-wrap: wrap; }
.actions-row button { flex: 1; min-width: 120px; }
.title-art { display: block; width: 100%; image-rendering: pixelated; border-radius: 6px; }
#sub { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--chalk-dim); gap: 8px; }
#sub span { min-width: 0; }
#kitchen { display: flex; align-items: center; gap: 8px; min-height: 58px; background: #18241f; border-radius: 8px; padding: 6px 8px; }
#kitchen .klabel { font-size: 11px; color: var(--chalk-dim); writing-mode: vertical-rl; letter-spacing: 2px; flex-shrink: 0; }
#jobs { display: flex; gap: 6px; overflow-x: auto; min-width: 0; flex: 1; }
#jobs:empty::before { content: '注文を受けると ここで調理します'; font-size: 12px; color: #6a7a72; align-self: center; }
.job { flex: 0 0 60px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 4px 4px; background: #2e3f37; border-bottom-width: 2px; border-radius: 6px; }
.job img { width: 24px; height: 24px; image-rendering: pixelated; }
.job .gauge { position: relative; width: 50px; height: 7px; background: #46564e; border-radius: 3px; overflow: hidden; }
.job .gauge .zone { position: absolute; top: 0; bottom: 0; background: #4fbf6a; opacity: 0.85; }
.job .gauge .fill { position: absolute; left: 0; top: 0; bottom: 0; background: #f2c14e; }
.job .gauge .fill.hot { background: #ff8a3a; }
.job .lbl { font-size: 10px; line-height: 1; color: var(--chalk-dim); white-space: nowrap; }
.job.ready { background: #f2c14e; color: #2a1e10; }
.job.ready .lbl { color: #2a1e10; }
.job.ready .gauge .fill { background: #6aa0d8; }
.job.perfect { outline: 2px solid #8affa0; }
.job.wait { opacity: 0.6; }
.tools { display: flex; gap: 6px; flex-shrink: 0; }
.ingr { display: grid; grid-template-columns: 28px 1fr auto auto; gap: 2px 8px; align-items: center; background: #24352e; border-radius: 8px; padding: 8px 10px; }
.ingr img { width: 24px; height: 24px; image-rendering: pixelated; grid-column: 1; grid-row: 1 / span 2; }
.ingr .name { font-size: 15px; grid-column: 2; grid-row: 1; min-width: 0; }
.ingr .desc { font-size: 12px; color: var(--chalk-dim); grid-column: 2; grid-row: 2; min-width: 0; }
.ingr .qty { grid-column: 3; grid-row: 1 / span 2; font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; min-width: 44px; }
.ingr .btns { grid-column: 4; grid-row: 1 / span 2; display: flex; gap: 4px; }
.ingr .btns button { padding: 8px 8px; min-width: 52px; font-size: 13px; }
.tag { display: inline-block; font-size: 11px; padding: 0 5px; border-radius: 4px; margin-left: 4px; vertical-align: 1px; }
.tag.cheap { background: #3f7a4a; color: #e8ffe8; }
.tag.high { background: #8a3a3a; color: #ffe8e8; }
.tag.fresh { background: #3a5a8a; color: #e8f0ff; }
.make { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--chalk-dim); }
.make b { color: var(--chalk); font-weight: normal; }
.make .zero { color: var(--bad); }
#sub button { padding: 4px 10px; font-size: 12px; border-bottom-width: 2px; white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="day" id="hudDay">1日目 10:00</div>
    <div class="money" id="hudMoney">¥0</div>
    <div class="stars" id="hudStars" aria-label="ひょうばん"></div>
  </div>
  <div id="stage">
    <canvas id="cafe" aria-label="カフェの店内"></canvas>
    <div id="talk" hidden role="dialog" aria-live="polite">
      <canvas id="face" width="64" height="64" aria-label="ぐりお"></canvas>
      <div class="msg"><span class="who">ぐりお</span><p id="talkText"></p><span class="next" id="talkNext">▼</span></div>
    </div>
  </div>
  <div id="kitchen" aria-label="キッチン"><span class="klabel">キッチン</span><div id="jobs"></div></div>
  <div id="actions">
    <button type="button" id="btnFood">ごはん<small id="foodLeft">のこり 0</small></button>
    <button type="button" id="btnStock">仕入れ<small id="stockInfo">ざいこ</small></button>
    <button type="button" id="btnShop">ショップ<small>家具など</small></button>
    <button type="button" id="btnCats">ねこ<small>ようす</small></button>
  </div>
  <div id="sub">
    <span>ふきだし＝注文・調理・運ぶ／お皿＝かたづけ／ねこ＝なでる</span>
    <span class="tools"><button type="button" id="btnSpeed">はやさ <span id="speedLabel">×1</span></button><button type="button" id="btnMute">音 ON</button></span>
  </div>
</div>
<div id="toast" hidden></div>
<div id="modal" hidden><div class="panel" id="panel"></div></div>
<script>
'use strict';
// ================= 画面 =================
const VW = 224, VH = 300, S = 4;
const cv = document.getElementById('cafe');
cv.width = VW * S; cv.height = VH * S;
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
function P(c, x, y, w = 1, h = 1) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function sprite(rows, pal) {
  const w = Math.max(...rows.map(r => r.length)), c = mk(w, rows.length), g = c.getContext('2d');
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) { const col = pal[r[x]]; if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); } } });
  return c;
}
function flipH(c) { const f = mk(c.width, c.height), g = f.getContext('2d'); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); return f; }
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function ellipse(cx, cy, rx, ry, col) {
  ctx.fillStyle = col;
  for (let y = -ry; y <= ry; y++) {
    const hw = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry + 0.0001))));
    ctx.fillRect(cx - hw, cy + y, hw * 2 + 1, 1);
  }
}

// ================= 高解像度のねこ（2倍の細かさで描く） =================
const CAT_LOOK = {
  grio:   { base: '#8c765a', light: '#a68d6b', shade: '#6a5640', stripe: '#3e3024', line: '#241a12', white: '#f8f4ec', eye: '#b9bb4a', pupil: '#16140e', ear: '#e2a39c', nose: '#e7969c', chest: true, paws: true, muzzle: true, tabby: true },
  ponta:  { base: '#6a5944', light: '#86735a', shade: '#4a3d2e', stripe: '#211912', line: '#17110b', white: '#e9e2d6', eye: '#a6cc4e', pupil: '#121008', ear: '#c9938c', nose: '#c4807a', chin: true, tabby: true, long: true, scarf: true },
  mike:   { base: '#fbf6ee', light: '#ffffff', shade: '#ddd4c6', line: '#5a463a', white: '#ffffff', eye: '#c89a2a', pupil: '#1a1408', ear: '#f2a0b0', nose: '#f29bb0', patches: ['#e8944a', '#3a3030'] },
  kuro:   { base: '#2e2e3a', light: '#4a4a5c', shade: '#1c1c24', line: '#0a0a10', white: '#2e2e3a', eye: '#e8c030', pupil: '#0a0a0a', ear: '#6a4a5a', nose: '#8a5a6a' },
  shiro:  { base: '#fbfbfd', light: '#ffffff', shade: '#d9d9e3', line: '#8a8a98', white: '#ffffff', eye: '#5a9ae0', pupil: '#1a2030', ear: '#f5a0b8', nose: '#f5a0b8' },
  chacha: { base: '#f0a050', light: '#f8c27a', shade: '#d4843a', stripe: '#c0661e', line: '#5a3010', white: '#fff2dc', eye: '#4f8a3a', pupil: '#121008', ear: '#f2a0a0', nose: '#e88a8a', chest: true, paws: true, muzzle: true, tabby: true },
};
const CAT_POSE = {
  // 座り（横向き・顔はこちら）
  sit: {
    W: 52, H: 47,
    body: [[21, 33, 13, 11], [30, 29, 8, 11], [25, 37, 14, 8]], head: [33, 14, 10, 9], cheek: [33, 17, 11.5, 6],
    ears: [[[24, 9], [25, 0], [31, 5]], [[35, 5], [41, 0], [42, 9]]], earsIn: [[[26, 7], [26, 3], [29, 5]], [[37, 5], [40, 3], [40, 7]]],
    legs: [[28, 30, 4, 14], [32, 31, 4, 13]], paws: [[30, 44, 2.6, 1.6], [34, 44, 2.6, 1.6], [13, 44, 4, 1.8]],
    tail: [[9, 34], [5, 39], [9, 44], [20, 45.5], [30, 45.5]], eyes: [[29, 14], [37, 14]], nose: [33, 18],
    chest: [31, 29, 4.5, 8], bodyStripes: [[11, 25, 13, 35], [15, 23, 17, 34], [19, 22, 21, 33], [23, 23, 24, 31]], shadeY: 38, light: [19, 26, 8, 4], scarfY: 22,
  },
  walkA: {
    W: 56, H: 39,
    body: [[24, 22, 16, 8], [37, 19, 6, 7]], head: [43, 13, 9, 8.5], cheek: [43, 16, 10, 5.5],
    ears: [[[35, 8], [36, 0], [41, 4]], [[45, 4], [50, 0], [52, 9]]], earsIn: [[[37, 6], [37, 3], [39, 5]], [[47, 5], [49, 3], [50, 7]]],
    legs: [[9, 26, 4, 11], [19, 27, 4, 10], [30, 26, 4, 11], [39, 27, 4, 10]], paws: [[11, 37, 2.6, 1.5], [21, 37, 2.6, 1.5], [32, 37, 2.6, 1.5], [41, 37, 2.6, 1.5]],
    tail: [[9, 18], [4, 14], [3, 8], [6, 3]], eyes: [[39, 13], [47, 13]], nose: [43, 17],
    chest: [37, 23, 4, 5], bodyStripes: [[12, 15, 13, 26], [17, 14, 18, 27], [22, 14, 23, 28], [27, 15, 28, 27]], shadeY: 26, light: [22, 17, 10, 3], scarfY: 20,
  },
  walkB: {
    W: 56, H: 39,
    body: [[24, 22, 16, 8], [37, 19, 6, 7]], head: [43, 13, 9, 8.5], cheek: [43, 16, 10, 5.5],
    ears: [[[35, 8], [36, 0], [41, 4]], [[45, 4], [50, 0], [52, 9]]], earsIn: [[[37, 6], [37, 3], [39, 5]], [[47, 5], [49, 3], [50, 7]]],
    legs: [[13, 26, 4, 11], [16, 27, 4, 10], [33, 26, 4, 11], [36, 27, 4, 10]], paws: [[15, 37, 2.6, 1.5], [18, 37, 2.6, 1.5], [35, 37, 2.6, 1.5], [38, 37, 2.6, 1.5]],
    tail: [[9, 18], [3, 15], [1, 9], [3, 4]], eyes: [[39, 13], [47, 13]], nose: [43, 17],
    chest: [37, 23, 4, 5], bodyStripes: [[12, 15, 13, 26], [17, 14, 18, 27], [22, 14, 23, 28], [27, 15, 28, 27]], shadeY: 26, light: [22, 17, 10, 3], scarfY: 20,
  },
  // まるくなって寝る
  sleep: {
    W: 52, H: 28,
    body: [[23, 18, 19, 9]], head: [39, 15, 9, 7.5], cheek: [39, 17, 10, 5],
    ears: [[[31, 11], [32, 3], [37, 7]], [[41, 7], [46, 3], [47, 11]]], earsIn: [[[33, 9], [33, 6], [35, 8]], [[43, 8], [45, 6], [45, 9]]],
    legs: [], paws: [[45, 24, 3, 1.6]], tail: [[5, 20], [8, 25], [22, 26.5], [36, 26]], eyes: [[35, 15], [43, 15]], nose: [39, 18], closed: true,
    chest: null, bodyStripes: [[10, 11, 12, 20], [15, 10, 16, 21], [20, 9, 21, 21], [25, 10, 26, 20]], shadeY: 22, light: [20, 12, 10, 3], scarfY: 21,
  },
};
function makeCatFine(L, P0) {
  const W = P0.W, H = P0.H, buf = Array.from({ length: H }, () => Array(W).fill(null));
  const set = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < W && y < H) buf[y][x] = c; };
  const ell = (x, y, cx, cy, rx, ry) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1;
  const tri = (x, y, a, b, c) => {
    const sg = (p, q, r) => (p[0] - r[0]) * (q[1] - r[1]) - (q[0] - r[0]) * (p[1] - r[1]);
    const d1 = sg([x, y], a, b), d2 = sg([x, y], b, c), d3 = sg([x, y], c, a);
    return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
  };
  const each = fn => { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) fn(x + 0.5, y + 0.5, x, y); };
  const thick = (pts, r, colFn) => {
    for (let i = 0; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 2);
      for (let k = 0; k <= n; k++) {
        const x = x0 + (x1 - x0) * k / n, y = y0 + (y1 - y0) * k / n;
        for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (dx * dx + dy * dy <= r * r + 0.5) set(x + dx, y + dy, colFn(i, k / n));
      }
    }
  };
  const line = (x0, y0, x1, y1, c) => { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2; for (let i = 0; i <= n; i++) set(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, c); };
  const inBody = (fx, fy) => P0.body.some(([cx, cy, rx, ry]) => ell(fx, fy, cx, cy, rx, ry));
  const inHead = (fx, fy) => ell(fx, fy, ...P0.head) || ell(fx, fy, ...P0.cheek);
  // しっぽ
  thick(P0.tail, L.long ? 2.4 : 1.6, (i, f) => (L.tabby && ((i * 7 + Math.round(f * 6)) % 4 === 0)) ? L.stripe : (L.patches && i >= P0.tail.length - 2 ? L.patches[1] : L.base));
  // 足
  for (const [x, y, w, h] of P0.legs) for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) set(xx, yy, yy > y + h - 3 && L.paws ? L.white : (xx === x ? L.shade : L.base));
  // 体と頭
  each((fx, fy, x, y) => {
    if (inBody(fx, fy)) buf[y][x] = fy > P0.shadeY ? L.shade : ell(fx, fy, ...P0.light) ? L.light : L.base;
    if (inHead(fx, fy)) buf[y][x] = fy < P0.head[1] - 4 && (x + y) % 3 === 0 ? L.light : L.base;
  });
  for (const [cx, cy, rx, ry] of P0.paws) each((fx, fy, x, y) => { if (ell(fx, fy, cx, cy, rx, ry)) buf[y][x] = L.paws ? L.white : L.base; });
  // 耳

function reviewText(r) {
  if (r.q === 'perfect' && Math.random() < 0.6) return `<div class="review"><span class="who">★★★★★</span><br>「${pick([`${r.item}がおいしすぎる！`, `${r.item}、できたてで さいこう`, 'ここの料理は ほんものだ…'])}」</div>`;
  if (r.q === 'cold' && r.sat < 70) return `<div class="review"><span class="who">★★☆☆☆</span><br>「${r.item}が ちょっと さめてた…」</div>`;
  const good = [`${r.item}がおいしかった！`, `また来たいです。${r.item}さいこう`, 'ゆっくりできました', 'おしゃれで落ち着くお店'];
  const cat = ['ねこが足元に来てくれて しあわせ…', 'ねこがとなりでゴロゴロしてた！', 'ねこと目があった。かわいすぎる'];
  const mid = [`${r.item}はふつうかな`, 'ちょっと待ったけど まあまあ', 'ねこにあいたかったな'];
  const bad = ['ぜんぜん注文が来ない…', 'まちくたびれた', 'ねこの毛がちょっと気になる'];
  const t = r.sat >= 70 ? (r.cat && Math.random() < 0.6 ? pick(cat) : pick(good)) : r.sat >= 45 ? pick(mid) : pick(bad);
  const st = r.sat >= 80 ? 5 : r.sat >= 65 ? 4 : r.sat >= 45 ? 3 : r.sat >= 25 ? 2 : 1;
  return `<div class="review"><span class="who">${'★'.repeat(st)}${'☆'.repeat(5 - st)}</span><br>「${t}」</div>`;
}

function update() {
  if (mode !== 'open' && mode !== 'closing') return;
  tick++;
  if (tick % 10 === 0 && G.time < CLOSE) { G.time++; if (G.time >= CLOSE) { mode = 'closing'; toast('閉店時間です。最後のお客さんを見送ろう'); } }
  if (mode === 'open' && --spawnTimer <= 0) {
    spawnCustomer();
    const base = 560 - G.pop * 3.2 - (G.menu.length - 2) * 25 - decor() * 10;
    spawnTimer = Math.round(clamp(base, 140, 620) * rnd(0.7, 1.3) * (weather === 'rain' ? 1.4 : 1) * (G.time < rushUntil ? 0.4 : 1));
  }
  if (staffBusy > 0) staffBusy--;
  updateJobs(); updatePonta();
  customers.forEach(updateCustomer);
  customers = customers.filter(c => !c.gone);
  for (const s of seats) if (s.dirty) { s.dirtyT++; if (G.staff && s.dirtyT > 160 && !staffBusy) { s.dirty = false; staffBusy = 30; } }
  cats.forEach(updateCat);
  for (const p of particles) { p.t++; p.y += p.vy; }
  particles = particles.filter(p => p.t < p.life);
  checkEvents();
  if (mode === 'closing' && customers.length === 0) { seats.forEach(s => { s.dirty = false; }); endDay(); }
}

  if (c.state === 'wait' && c.job) { drawCookBubble(c, c.job, x, y); return; }
  P('#3a3030', x, y + 1, 18, 14); P('#3a3030', x + 1, y, 16, 16);
  P('#ffffff', x + 1, y + 1, 16, 14); P('#3a3030', x + 7, y + 16, 4, 2); P('#ffffff', x + 8, y + 15, 2, 2);
  ctx.drawImage(ICON[c.order.id], x + 5, y + 2);
  if (c.vip) drawCrown(x + 9, y - 5);
  if (!canMake(c.order)) { P('#e8483a', x + 11, y + 1, 6, 6); P('#ffffff', x + 12, y + 2, 1, 1); P('#ffffff', x + 15, y + 2, 1, 1); P('#ffffff', x + 13, y + 3, 2, 2); P('#ffffff', x + 12, y + 5, 1, 1); P('#ffffff', x + 15, y + 5, 1, 1); }
  const f = c.pat / c.maxPat;
  P('#d8d0d0', x + 2, y + 12, 14, 2); P(f > 0.5 ? '#5ac85a' : f > 0.25 ? '#f0c040' : '#e85a4a', x + 2, y + 12, Math.max(1, Math.round(14 * f)), 2);
  if (f < 0.25 && (tick >> 3) & 1) P('#e85a4a', x + 17, y - 2, 2, 5);
}
function drawCookBubble(c, j, x, y) {
  const ready = j.state === 'ready', blink = (tick >> 3) & 1;
  const bg = ready ? (blink ? '#fff2a8' : '#ffe070') : '#f4f0e8';
  P('#3a3030', x, y + 1, 18, 14); P('#3a3030', x + 1, y, 16, 16);
  P(bg, x + 1, y + 1, 16, 14); P('#3a3030', x + 7, y + 16, 4, 2); P(bg, x + 8, y + 15, 2, 2);
  ctx.globalAlpha = j.state === 'queue' ? 0.45 : 1; ctx.drawImage(ICON[j.item.id], x + 5, y + 1); ctx.globalAlpha = 1;
  if (j.state === 'cook') {
    const f = j.t / j.dur;
    P('#c8c0b8', x + 2, y + 11, 14, 3);
    if (!j.missed) P('#4fbf6a', x + 2 + Math.round(14 * ZONE[0]), y + 11, Math.max(1, Math.round(14 * (ZONE[1] - ZONE[0]))), 3);
    P('#e8702a', x + 2, y + 12, Math.max(1, Math.round(14 * f)), 1);
    if ((tick >> 4) & 1) { P('#ffffff', x + 13, y - 2, 1, 2); P('#ffffff', x + 15, y - 3, 1, 2); }
  } else if (j.state === 'queue') {
    for (let i = 0; i < 3; i++) if ((tick >> 4) % 4 > i) P('#8a8a8a', x + 5 + i * 3, y + 12, 2, 2);
  } else if (ready) {
    P('#e8483a', x + 15, y - 3, 2, 5); P('#e8483a', x + 15, y + 3, 2, 2);
    const cold = j.readyT / COLD_AFTER;
    P('#c8c0b8', x + 2, y + 12, 14, 2); P(cold < 1 ? '#6aa0d8' : '#8a8aa0', x + 2, y + 12, Math.max(1, Math.round(14 * Math.min(1, cold))), 2);
  }
  if (c.vip) drawCrown(x + 9, y - 5);
}
function drawParticles() {
  for (const p of particles) {
    if (p.t < 0) continue;
    ctx.globalAlpha = Math.min(1, (1 - p.t / p.life) * 2);
    if (p.type === 'heart') ctx.drawImage(HEART, Math.round(p.x - 3), Math.round(p.y));
    else if (p.type === 'spark') { for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + p.t / 10, r = 4 + p.t / 4; P('#fff6a0', Math.round(p.x + Math.cos(a) * r), Math.round(p.y + Math.sin(a) * r), 2, 2); } }
    else if (p.type === 'anger') { P('#e83a3a', p.x - 3, p.y, 2, 6); P('#e83a3a', p.x + 1, p.y, 2, 6); P('#e83a3a', p.x - 4, p.y - 1, 8, 2); }
    else if (p.type === 'text') {
      ctx.font = '8px "DotGothic16", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillStyle = '#2a1e10'; ctx.fillText(p.text, Math.round(p.x) + 1, Math.round(p.y) + 1);
      ctx.fillStyle = p.color; ctx.fillText(p.text, Math.round(p.x), Math.round(p.y));
    }
    ctx.globalAlpha = 1;
  }
}
function render() {
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = false;
  if (!G) { drawWallAndFloor(OPEN); return; }
  drawRoom();
  for (const f of furs) ctx.drawImage(FUR, f.x - 3, f.y - 3);
  const list = [];
  for (let i = 0; i < G.furniture.cushion; i++) { const [x, y] = CUSHION_POS[i]; list.push({ y: y - 2, d: () => drawCushion(x, y) }); }
  for (let i = 0; i < G.furniture.plant; i++) { const [x, y] = PLANT_POS[i]; list.push({ y, d: () => drawPlant(x, y) }); }
  if (G.furniture.tower) list.push({ y: TOWER.base, d: drawTower });
  list.push({ y: BOWL.y, d: drawBowl });
  for (let i = 0; i < G.furniture.table; i++) {
    const [x, y] = TABLE_POS[i];
    list.push({ y: y - 8.5, d: () => { drawChair(x - 9, y); drawChair(x + 9, y); } });
    list.push({ y, d: () => { drawTable(x, y); seats.filter(s => s.ti === i).forEach(drawTableItems); } });
  }
  for (const c of customers) list.push({ y: c.state === 'enter' || c.state === 'leave' ? c.y : c.seat.y - 0.2, d: () => drawCustomer(c) });
  if (ponta) list.push({ y: ponta.y, d: drawPonta });
  for (const k of cats) list.push({ y: k.spot === TOWER && k.state === 'nap' ? TOWER.base + 1 : k.y, d: () => drawCat(k) });
  list.sort((a, b) => a.y - b.y).forEach(o => o.d());
  for (const c of customers) if (c.state === 'order' || c.state === 'wait') drawBubble(c);
  drawParticles();
  const f = (G.time - OPEN) / (CLOSE - OPEN);
  if (f > 0.65) { ctx.fillStyle = `rgba(255,140,60,${Math.min(0.16, (f - 0.65) * 0.6)})`; ctx.fillRect(0, 0, VW, VH); }
}

const jobEls = new Map();
function renderJobs() {
  const box = $('jobs'), alive = new Set(jobs.map(j => j.id));
  for (const [id, el] of jobEls) if (!alive.has(id)) { el.remove(); jobEls.delete(id); }
  for (const j of jobs) {
    let el = jobEls.get(j.id);
    if (!el) {
      el = document.createElement('button'); el.type = 'button'; el.className = 'job';
      el.innerHTML = `<img src="${ICON_URL[j.item.id]}" alt="${j.item.name}"><span class="gauge"><span class="zone"></span><span class="fill"></span></span><span class="lbl"></span>`;
      el.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); if (!isPaused()) cookTap(j); });
      box.appendChild(el); jobEls.set(j.id, el);
    }
    const zone = el.querySelector('.zone'), fill = el.querySelector('.fill'), lbl = el.querySelector('.lbl');
    el.classList.toggle('ready', j.state === 'ready');
    el.classList.toggle('wait', j.state === 'queue');
    el.classList.toggle('perfect', j.q === 'perfect');
    if (j.state === 'cook') {
      zone.style.display = j.missed ? 'none' : '';
      zone.style.left = ZONE[0] * 100 + '%'; zone.style.width = (ZONE[1] - ZONE[0]) * 100 + '%';
      fill.style.width = (j.t / j.dur * 100) + '%'; fill.classList.add('hot');
      lbl.textContent = j.missed ? 'ふつうに' : STATIONS[j.st].name.slice(0, 5);
    } else if (j.state === 'queue') {
      zone.style.display = 'none'; fill.style.width = '0'; lbl.textContent = 'じゅんばん';
    } else {
      zone.style.display = 'none'; fill.classList.remove('hot');
      fill.style.width = Math.min(100, j.readyT / COLD_AFTER * 100) + '%';
      lbl.textContent = j.readyT > COLD_AFTER && j.q !== 'perfect' ? 'さめた…' : j.q === 'perfect' ? 'はこぶ！★' : 'はこぶ！';
    }
  }
}

function buy(id) {
  const [, kind, key] = id.split('-');
  if (kind === 'k') {
    const st = STATIONS[key]; if (G.money < st.price || G.kitchen[key] >= 2) return;
    G.money -= st.price; G.kitchen[key]++; toast(`${st.name}をもう1台おきました`);
  } else if (kind === 'f') {
    const f = FURNITURE.find(x => x.id === key); if (G.money < f.price || G.furniture[key] >= f.max) return;
    G.money -= f.price; G.furniture[key]++; if (key === 'table') buildSeats();
    toast(`${f.name}をおきました`);
  } else if (kind === 'm') {
    const m = MENU.find(x => x.id === key); if (G.money < m.unlock || G.menu.includes(key)) return;
    G.money -= m.unlock; G.menu.push(key);
    const recipe = Object.entries(m.need).map(([id, n]) => ingr(id).name + (n > 1 ? `×${n}` : '')).join('・');
    say([['happy', `${m.name}が メニューに くわわったにゃ！`], ['normal', `材料は ${recipe}。「仕入れ」で 買っておいてね。`]]);
  } else if (kind === 'c') {
    const a = ADOPT.find(x => x.pal === key); if (G.money < a.price || cats.some(c => c.pal === key)) return;
    G.money -= a.price;
    const k = { name: a.name, pal: a.pal, mood: 60, hunger: 30 };
    G.cats.push(k); cats.push(makeCat(k, ENTRANCE.x, 282));
    toast(`${a.name}がカフェのなかまになりました`); setTimeout(sfx.meow, 300);
    say([['happy', `${a.name}、ようこそ！ なかよく しようにゃ。`]]);
  } else if (kind === 's') {
    if (G.money < STAFF.price || G.staff) return; G.money -= STAFF.price; G.staff = true; toast('アルバイトさんが来てくれました');
  }
  sfx.buy(); G.cats = cats.map(k => ({ name: k.name, pal: k.pal, mood: Math.round(k.mood), hunger: Math.round(k.hunger) })); save(); updateHud();
}

function canvasPoint(e) {
  const r = cv.getBoundingClientRect(), b = 3;
  return { x: (e.clientX - r.left - b) / (r.width - b * 2) * VW, y: (e.clientY - r.top - b) / (r.height - b * 2) * VH };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  if (!G || isPaused() || (mode !== 'open' && mode !== 'closing')) return;
  const { x, y } = canvasPoint(e);
  for (const c of customers) {

const FACE_C = {

  earIn: '#c9938c', earInD: '#a07068', eye: '#a6cc4e', eyeD: '#6a9230', pupil: '#121008', nose: '#c4807a', noseD: '#9a5c58', blush: '#d8a098',

function makePortrait(expr, who = 'grio') {

}
