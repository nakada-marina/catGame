<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16141a">
<title>ぐりおの冒険</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2ead8;
  --ink: #2a2420;
  --muted: #6a5f55;
  --frame: #2a2420;
  --btn: #3a3330;
  --btn-ink: #f2ead8;
  --btn-on: #ff9a2a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16141a;
    --ink: #ece6da;
    --muted: #9a92a6;
    --frame: #000;
    --btn: #3a3644;
    --btn-ink: #ece6da;
    --btn-on: #ff9a2a;
  }
}
:root[data-theme="dark"] {
  --bg: #16141a;
  --ink: #ece6da;
  --muted: #9a92a6;
  --frame: #000;
  --btn: #3a3644;
  --btn-ink: #ece6da;
  --btn-on: #ff9a2a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "DotGothic16", monospace;
  display: flex;
  justify-content: center;
  padding: 16px;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
#wrap {
  width: min(100%, 768px, calc((100dvh - 210px) * 256 / 224));
  min-width: min(100%, 288px);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
#game {
  display: block;
  width: 100%;
  aspect-ratio: 256 / 224;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  border: 4px solid var(--frame);
  border-radius: 4px;
  background: #000;
  touch-action: none;
}
#bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: var(--muted);
}
#bar .tools { display: flex; gap: 8px; }
#hint { line-height: 1.4; }
button {
  font-family: inherit;
  color: var(--btn-ink);
  background: var(--btn);
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  touch-action: none;
}
#bar button { padding: 6px 12px; font-size: 14px; white-space: nowrap; }
#bar .tools { flex-shrink: 0; }
#pad {
  display: flex;
  justify-content: space-between;
  align-items: center;
  touch-action: none;
}
.dpad { display: flex; gap: 12px; }
.dpad button { width: 72px; height: 72px; font-size: 26px; border-radius: 12px; }
.jump { width: 96px; height: 96px; border-radius: 50%; font-size: 18px; background: #c8402c; color: #fff; }
button.on { background: var(--btn-on); color: #000; }
@media (hover: hover) and (pointer: fine) {
  #pad { display: none; }
}
@media (hover: none), (pointer: coarse) {
  #hint { display: none; }
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" aria-label="ぐりおの冒険 ゲーム画面"></canvas>
  <div id="bar">
    <div id="hint">← → いどう ／ スペース・Z ジャンプ ／ Enter スタート</div>
    <div class="tools">
      <button id="muteBtn" type="button">音：ON</button>
      <button id="pauseBtn" type="button">一時停止</button>
    </div>
  </div>
  <div id="pad">
    <div class="dpad">
      <button type="button" data-k="left" aria-label="左">◀</button>
      <button type="button" data-k="right" aria-label="右">▶</button>
    </div>
    <button type="button" class="jump" data-k="jump" aria-label="ジャンプ">ジャンプ</button>
  </div>
</div>
<script>
'use strict';
// ===== 基本設定 =====
const TILE = 16, VW = 256, VH = 224, S = 2, ROWS = 14, GROUND_Y = 192;
const cv = document.getElementById('game');
cv.width = VW * S; cv.height = VH * S;
const ctx = cv.getContext('2d');

function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function px(g, col, x, y, w = 1, h = 1) { g.fillStyle = col; g.fillRect(x, y, w, h); }
function sprite(rows, pal) {
  const c = mk(16, rows.length), g = c.getContext('2d');
  rows.forEach((r, y) => { for (let x = 0; x < 16; x++) { const col = pal[r[x]]; if (col) px(g, col, x, y); } });
  return c;
}
function flipH(c) { const f = mk(c.width, c.height), g = f.getContext('2d'); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); return f; }
function flipV(c) { const f = mk(c.width, c.height), g = f.getContext('2d'); g.translate(0, c.height); g.scale(1, -1); g.drawImage(c, 0, 0); return f; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ===== ドット絵 =====
const CAT_PAL = { k: '#202020', g: '#a8a8b4', d: '#646470', w: '#f8f8f8', p: '#ff8fa8' };
const CAT_TOP = [
  '................',
  '.........k....k.',
  '........kpk..kpk',
  '........kggggggk',
  '..k.....kgdgdggk',
  '.kgk....kgkggkgk',
  '.kgk....kgwwpwwk',
  '..kgkkkkkgwwwwwk',
  '..kgggdgdgkkkkk.',
  '...kggdgdggggk..',
  '...kgggggggwgk..',
  '...kgggggggwgk..',
];
const CAT_LEGS = {
  stand: ['...kgkkkkkkgkk..', '...kgk....kgk...', '...kwk....kwk...', '...kk.....kk....'],
  run1:  ['...kggkkkkkggk..', '..kgk......kgk..', '.kwk........kwk.', '.kk..........kk.'],
  run2:  ['...kgkkkkkkgkk..', '....kgk..kgk....', '....kwk..kwk....', '....kk...kk.....'],
  jump:  ['..kwkkkkkkkkwk..', '..kk........kk..', '................', '................'],
};
const CAT = {};
for (const k in CAT_LEGS) { const r = sprite(CAT_TOP.concat(CAT_LEGS[k]), CAT_PAL); CAT[k] = [r, flipH(r)]; }
CAT.dead = flipV(CAT.stand[0]);

const E8 = '................';
const MOUSE_PAL = { k: '#202020', b: '#9a8878', p: '#ff8fa8' };
const MOUSE_BODY = [E8, E8, E8, E8, E8, E8, E8, E8,
  '...kk...........', '..kppk.kkkkk....', '..kbbkkbbbbbk...', '.kbkbbbbbbbbbk..',
  'kpbbbbbbbbbbbk.k', '.kkbbbbbbbbbbkk.'];
const MOUSE = [
  sprite(MOUSE_BODY.concat(['...kkbkkkbkk....', '....kk...kk.....']), MOUSE_PAL),
  sprite(MOUSE_BODY.concat(['...kbkkkbkkk....', '...kk...kk......']), MOUSE_PAL),
];
const MOUSE_SQUISH = sprite([E8, E8, E8, E8, E8, E8, E8, E8, E8, E8, E8, E8,
  '..kkkkkkkkkkk...', '.kbkbbbbbbbbbk..', 'kpbbbbbbbbbbbbkk', '.kkkkkkkkkkkkk..'], MOUSE_PAL);

const HEDGE_PAL = { k: '#202020', s: '#5b3a1e', f: '#e0b080' };
const HEDGE_BODY = [E8, E8, E8, E8, E8, E8, E8,
  '....k.k.k.k.....', '...kskskskskk...', '..ksssssssssk...', '.kssssssssssk...',
  'kfkssssssssssk..', 'kffkssssssssk...', '.kkfffffffffk...'];
const HEDGE = [
  sprite(HEDGE_BODY.concat(['...kfkkkkfk.....', '...kk....kk.....']), HEDGE_PAL),
  sprite(HEDGE_BODY.concat(['...kfkkkfk......', '....kk..kk......']), HEDGE_PAL),
];

const FISH = sprite([E8, E8, E8, E8,
  '...kkkkk....kk..', '..kbbbbbk..kbk..', '.kbwkbbbbkkbbk..', 'kbbbbbbdbbbbk...',
  '.kbbbbbbbkkbbk..', '..kbbbbbk..kbk..', '...kkkkk....kk..',
  E8, E8, E8, E8, E8], { k: '#14325a', b: '#5ab4ff', d: '#2a78c8', w: '#ffffff' });

// ===== ステージの見た目 =====
const THEMES = {
  day: {
    sky: '#6b8cff', dirt: '#c8743c', dirtDark: '#8a4a20', grass: '#58c848', grassDark: '#2a8a2a',
    brick: '#c8501c', brickDark: '#4a1800', hill: '#3aa84a', hillDark: '#1e6e2e',
    cloud: '#ffffff', cloudShade: '#c8dcff', stone: '#e0a868', stoneLight: '#ffd8a0', stoneDark: '#8a5a2a', night: false,
  },
  night: {
    sky: '#141838', dirt: '#6a4a7a', dirtDark: '#3a2a4a', grass: '#3a8a7a', grassDark: '#1e5a50',
    brick: '#7a3a5a', brickDark: '#2a0e20', hill: '#24345a', hillDark: '#141e3a',
    cloud: '#4a5280', cloudShade: '#363c66', stone: '#8a7aa0', stoneLight: '#b8a8d0', stoneDark: '#4a3a60', night: true,
  },
};
function tileCanvas(fn) { const c = mk(16, 16); fn(c.getContext('2d')); return c; }
function makeTiles(th) {
  const specks = g => { for (let i = 0; i < 9; i++) px(g, th.dirtDark, (i * 7 + 3) % 15, 5 + (i * 5) % 10, 2, 1); };
  const qBlock = (base, light) => tileCanvas(g => {
    px(g, base, 0, 0, 16, 16); px(g, light, 0, 0, 16, 1); px(g, light, 0, 0, 1, 16);
    px(g, '#7a3a00', 0, 15, 16, 1); px(g, '#7a3a00', 15, 0, 1, 16);
    [[2, 2], [13, 2], [2, 13], [13, 13]].forEach(([x, y]) => px(g, '#7a3a00', x, y));
    ['.kkkk.', 'kk..kk', '....kk', '...kk.', '..kk..', '..kk..', '......', '..kk..']
      .forEach((r, y) => { for (let x = 0; x < 6; x++) if (r[x] === 'k') px(g, '#7a3a00', 5 + x, 4 + y); });
  });
  return {
    grassTop: tileCanvas(g => { px(g, th.dirt, 0, 0, 16, 16); specks(g); px(g, th.grass, 0, 0, 16, 4); px(g, th.grassDark, 0, 4, 16, 1); px(g, th.grass, 3, 4); px(g, th.grass, 10, 4, 2, 1); }),
    dirt: tileCanvas(g => { px(g, th.dirt, 0, 0, 16, 16); specks(g); }),
    brick: tileCanvas(g => {
      px(g, th.brick, 0, 0, 16, 16);
      for (const y of [3, 7, 11, 15]) px(g, th.brickDark, 0, y, 16, 1);
      for (const y0 of [0, 8]) { px(g, th.brickDark, 7, y0, 1, 3); px(g, th.brickDark, 15, y0, 1, 3); }
      for (const y0 of [4, 12]) { px(g, th.brickDark, 3, y0, 1, 3); px(g, th.brickDark, 11, y0, 1, 3); }
    }),
    q: [qBlock('#f8b800', '#ffe8a0'), qBlock('#ffd040', '#fff4c8'), qBlock('#e8a000', '#ffd880')],
    used: tileCanvas(g => {
      px(g, '#8a5a2a', 0, 0, 16, 16); px(g, '#4a2a10', 0, 15, 16, 1); px(g, '#4a2a10', 15, 0, 1, 16);
      px(g, '#4a2a10', 0, 0, 16, 1); px(g, '#4a2a10', 0, 0, 1, 16);
      [[2, 2], [13, 2], [2, 13], [13, 13]].forEach(([x, y]) => px(g, '#4a2a10', x, y));
    }),
    stone: tileCanvas(g => {
      px(g, th.stone, 0, 0, 16, 16); px(g, th.stoneLight, 0, 0, 16, 2); px(g, th.stoneLight, 0, 0, 2, 16);
      px(g, th.stoneDark, 0, 14, 16, 2); px(g, th.stoneDark, 14, 0, 2, 16); px(g, th.stoneDark, 4, 4, 8, 8); px(g, th.stone, 5, 5, 6, 6);
    }),
    // つめとぎポール（ドカンのかわり）
    towerTop: tileCanvas(g => {
      px(g, '#202020', 0, 0, 16, 7); px(g, '#e04848', 1, 1, 14, 5); px(g, '#ff8a8a', 2, 1, 10, 1);
      px(g, '#d8c090', 2, 7, 12, 9); px(g, '#202020', 1, 7, 1, 9); px(g, '#202020', 14, 7, 1, 9);
      for (let y = 9; y < 16; y += 3) px(g, '#a08858', 2, y, 12, 1);
    }),
    tower: tileCanvas(g => {
      px(g, '#d8c090', 2, 0, 12, 16); px(g, '#202020', 1, 0, 1, 16); px(g, '#202020', 14, 0, 1, 16);
      for (let y = 1; y < 16; y += 3) px(g, '#a08858', 2, y, 12, 1);
    }),
    spike: tileCanvas(g => {
      for (const cx of [4, 12]) for (let yy = 0; yy < 8; yy++) {
        const half = yy >> 1;
        px(g, '#e8e8f0', cx - half, 8 + yy, half + 1, 1); px(g, '#9090a0', cx + 1, 8 + yy, half, 1);
      }
    }),
  };
}
function makeCloud(th) {
  const c = mk(32, 16), g = c.getContext('2d');
  const circles = [[8, 9, 6], [16, 6, 7], [24, 9, 6]];
  for (let y = 0; y < 16; y++) for (let x = 0; x < 32; x++) {
    const inside = circles.some(([cx, cy, r]) => (x - cx) ** 2 + (y - cy) ** 2 <= r * r) || (y >= 9 && y <= 14 && x >= 3 && x <= 28);
    if (inside) px(g, y > 10 ? th.cloudShade : th.cloud, x, y);
  }
  return c;
}

// ===== ステージ =====
function blank(w) { return Array.from({ length: ROWS }, () => Array(w).fill('.')); }
function put(m, x, y, s) { for (let i = 0; i < s.length; i++) if (s[i] !== ' ') m[y][x + i] = s[i]; }
function ground(m, a, b) { for (let x = a; x <= b; x++) { m[12][x] = '#'; m[13][x] = '#'; } }
function column(m, x, h, ch = 'S') { for (let i = 0; i < h; i++) m[11 - i][x] = ch; }
function tower(m, x, h) { column(m, x, h, 'T'); column(m, x + 1, h, 'T'); }
function stairsUp(m, x, n) { for (let i = 0; i < n; i++) column(m, x + i, i + 1); }
function stairsDown(m, x, n) { for (let i = 0; i < n; i++) column(m, x + i, n - i); }

const STAGES = [
  function () {
    const W = 200, m = blank(W);
    ground(m, 0, 68); ground(m, 71, 110); ground(m, 114, 150); ground(m, 153, 199);
    put(m, 10, 9, 'fff');
    put(m, 16, 8, '?'); put(m, 20, 8, 'B?B?B'); put(m, 22, 4, '?');
    tower(m, 28, 2); tower(m, 38, 3); tower(m, 46, 4); tower(m, 57, 4);
    put(m, 77, 8, 'B?B'); put(m, 80, 4, 'BBBBBB'); put(m, 81, 3, 'ffff');
    put(m, 92, 8, '?'); put(m, 96, 8, 'B?');
    stairsUp(m, 106, 4); column(m, 110, 4); stairsDown(m, 114, 4);
    put(m, 125, 11, '^^');
    put(m, 130, 8, '?B?B?'); put(m, 139, 9, 'fff');
    tower(m, 156, 3); tower(m, 162, 2);
    stairsUp(m, 170, 8); column(m, 178, 8);
    return {
      name: '1-1', title: 'ひだまりの はらっぱ', theme: 'day', map: m, start: 3, checkpoint: 72, goal: 186, house: 191,
      enemies: [['m', 22], ['m', 41], ['m', 51], ['m', 53], ['h', 64], ['m', 85], ['m', 88], ['h', 98], ['m', 101],
        ['m', 132], ['m', 136], ['m', 140], ['h', 145], ['m', 166], ['m', 168]],
    };
  },
  function () {
    const W = 210, m = blank(W);
    ground(m, 0, 30); ground(m, 34, 60); ground(m, 67, 100); ground(m, 104, 140); ground(m, 144, 209);
    put(m, 12, 8, '?B?');
    tower(m, 40, 3); put(m, 50, 7, 'BBBB'); put(m, 50, 6, 'ffff');
    put(m, 63, 9, 'BB');
    put(m, 75, 11, '^^^');
    put(m, 82, 8, 'B??B'); put(m, 84, 4, '?');
    stairsUp(m, 97, 3); column(m, 100, 3); stairsDown(m, 104, 3);
    tower(m, 112, 2); tower(m, 118, 3); tower(m, 124, 4);
    put(m, 132, 8, 'B?B?B?B'); put(m, 132, 4, 'fffffff');
    put(m, 150, 11, '^^');
    stairsUp(m, 175, 8); column(m, 183, 8);
    return {
      name: '1-2', title: 'よるの まちはずれ', theme: 'night', map: m, start: 3, checkpoint: 70, goal: 192, house: 197,
      enemies: [['m', 18], ['m', 24], ['h', 46], ['m', 52], ['m', 56], ['h', 90], ['m', 92], ['m', 94],
        ['m', 115], ['m', 121], ['h', 128], ['m', 155], ['h', 160], ['m', 163], ['m', 165]],
    };
  },
];

// ===== 音 =====
let actx = null, master = null, muted = false;
function initAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC(); master = actx.createGain(); master.gain.value = muted ? 0 : 0.12; master.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
}
function toneAt(f, d, type, v, at, slide) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, at);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, at + d);
  g.gain.setValueAtTime(0.0001, at); g.gain.linearRampToValueAtTime(v, at + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, at + d);
  o.connect(g); g.connect(master); o.start(at); o.stop(at + d + 0.05);
}
function tone(f, d, type = 'square', v = 0.5, slide = null, delay = 0) { if (actx) toneAt(f, d, type, v, actx.currentTime + delay, slide); }
const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
function jingle(notes, step, type = 'square') { notes.forEach((n, i) => tone(mtof(n), i === notes.length - 1 ? step * 4 : step * 0.9, type, 0.5, null, i * step)); }
const sfx = {
  jump() { tone(300, 0.16, 'square', 0.45, 820); },
  coin() { tone(988, 0.07, 'square', 0.4); tone(1319, 0.28, 'square', 0.4, null, 0.07); },
  stomp() { tone(260, 0.12, 'square', 0.6, 90); },
  bump() { tone(140, 0.08, 'triangle', 0.9); },
  die() { jingle([71, 77, 77, 77, 76, 74, 72], 0.14); },
  clear() { jingle([67, 72, 76, 79, 84, 88, 84, 88, 91], 0.11); },
  oneup() { jingle([76, 79, 88, 84, 86, 91], 0.08); },
  over() { jingle([72, 67, 64, 69, 71, 69, 68, 70, 68, 67], 0.18, 'triangle'); },
  tick() { tone(1568, 0.03, 'square', 0.25); },
  meow() { tone(700, 0.25, 'sawtooth', 0.25, 420); },
};
// オリジナルBGM（8分音符 = 1）
const MELODY = [
  [76, 1], [79, 1], [81, 2], [79, 1], [76, 1], [72, 2], [74, 1], [76, 1], [79, 2], [76, 2], [0, 2],
  [76, 1], [79, 1], [81, 2], [84, 1], [83, 1], [81, 2], [79, 1], [76, 1], [74, 2], [72, 2], [0, 2],
  [77, 1], [77, 1], [81, 2], [77, 1], [76, 1], [74, 2], [76, 1], [76, 1], [79, 2], [76, 1], [74, 1], [72, 2],
  [74, 1], [74, 1], [77, 2], [76, 1], [74, 1], [71, 2], [72, 2], [67, 2], [72, 2], [0, 2],
];
const BASS = [48, 43, 41, 43, 41, 48, 43, 48];
function buildSong(shift) {
  const ev = []; let t = 0;
  for (const [n, l] of MELODY) { if (n) ev.push({ t, f: mtof(n + shift), d: l * 0.9, type: 'square', v: 0.3 }); t += l; }
  let bt = 0;
  for (const r of BASS) for (let k = 0; k < 4; k++) { ev.push({ t: bt, f: mtof((k % 2 ? r + 7 : r) + shift), d: 1.8, type: 'triangle', v: 0.7 }); bt += 2; }
  ev.sort((a, b) => a.t - b.t);
  return { ev, total: t };
}
const SONGS = { day: { song: buildSong(0), step: 0.19 }, night: { song: buildSong(-3), step: 0.22 } };
let bgm = null, bgmPtr = 0, bgmStart = 0;
function startBGM() { if (!actx) return; bgm = SONGS[theme && theme.night ? 'night' : 'day']; bgmPtr = 0; bgmStart = actx.currentTime + 0.08; }
function stopBGM() { bgm = null; }
setInterval(() => {
  if (!bgm || !actx) return;
  const now = actx.currentTime, { song, step } = bgm;
  for (let guard = 0; guard < 200; guard++) {
    const e = song.ev[bgmPtr], at = bgmStart + e.t * step;
    if (at > now + 0.25) break;
    if (at >= now - 0.05) toneAt(e.f, e.d * step, e.type, e.v, at);
    if (++bgmPtr >= song.ev.length) { bgmPtr = 0; bgmStart += song.total * step; }
  }
}, 50);

// ===== 入力 =====
const keys = { left: false, right: false, jump: false };
const edge = { jump: false, start: false };
function press(k) { if (k === 'jump' && !keys.jump) edge.jump = true; keys[k] = true; }
function release(k) { keys[k] = false; }
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  Space: 'jump', KeyZ: 'jump', ArrowUp: 'jump', KeyW: 'jump', Enter: 'start', KeyP: 'pause', KeyM: 'mute',
};
addEventListener('keydown', e => {
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault(); initAudio();
  if (e.repeat && k !== 'left' && k !== 'right') return;

  ctx.drawImage(FISH, 196, GROUND_Y - 14);
  if (frame % 60 < 42) text('ジャンプボタン か Enter で スタート', VW / 2, 118, { align: 'center' });
  text('ハイスコア ' + pad(hi, 6), VW / 2, 136, { align: 'center', color: '#fff8b0' });
}
function drawBlack() {
  px(ctx, '#000', 0, 0, VW, VH);
  if (state === 'intro') {
    drawHUD();
    text('ステージ ' + stage.name, VW / 2, 72, { size: 16, align: 'center' });
    text(stage.title, VW / 2, 94, { align: 'center', color: '#ffd080' });
    ctx.drawImage(CAT.stand[0], 100, 116); text('×  ' + lives, 124, 120);
  } else if (state === 'gameover') {
    text('ゲームオーバー', VW / 2, 96, { size: 16, align: 'center' });
    text('スコア ' + pad(score, 6), VW / 2, 124, { align: 'center' });
  } else if (state === 'ending') {
    text('おめでとう！', VW / 2, 40, { size: 16, align: 'center', color: '#ffd080' });
    text('ぐりおは ぶじに', VW / 2, 70, { align: 'center' });
    text('おうちに かえれました', VW / 2, 84, { align: 'center' });
    ctx.drawImage(CAT[(frame >> 4) & 1 ? 'stand' : 'jump'][0], 104, 104, 32, 32);
    ctx.drawImage(FISH, 138, 116);
    text('スコア ' + pad(score, 6), VW / 2, 148, { align: 'center' });
    if (score >= hi) text('ハイスコア こうしん！', VW / 2, 162, { align: 'center', color: '#fff8b0' });
    if (stateTimer > 90 && frame % 60 < 42) text('ボタンで タイトルへ', VW / 2, 188, { align: 'center' });
  }
}
function render() {
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = false;
  if (state === 'title') drawTitle();
  else if (state === 'intro' || state === 'gameover' || state === 'ending') drawBlack();
  else drawWorld();
}

// ===== ループ =====
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(loop);
}
const start = () => requestAnimationFrame(t => { last = t; loop(t); });
if (document.fonts && document.fonts.load) {
  Promise.race([document.fonts.load('16px "DotGothic16"'), new Promise(r => setTimeout(r, 1500))]).then(start, start);
} else start();
</script>
