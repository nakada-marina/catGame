<!doctype html>
<html lang="ja">
<head>

<style>
/* 黒板メニューのような深緑 × チョーク色 × 木の色。ひとつの世界観で固定 */
:root {
  --board: #1f2e28;
  --board-2: #2a3d35;
  --chalk: #efe9dc;
  --chalk-dim: #a9b8ad;
  --butter: #f2c14e;
  --wood: #7a5232;
  --wood-hi: #94663f;
  --rose: #e88a9a;
  --bad: #ff8a7a;
  --font: "DotGothic16", "Hiragino Maru Gothic ProN", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
html { box-sizing: border-box; }
body {
  background: var(--board);
  color: var(--chalk);
  font-family: var(--font);
  display: flex;
  justify-content: center;
  align-items: safe center;
  padding-inline: 16px;
  padding-block: 6px;
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
#wrap {
  width: min(100%, 640px, calc((100dvh - 170px) / 1.72));
  display: flex;
  flex-direction: column;
  gap: 6px;
}
#hud {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 8px 12px;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
}
#hud .day { color: var(--chalk-dim); white-space: nowrap; }
#hud .money { text-align: center; font-size: 18px; color: var(--butter); white-space: nowrap; }
#hud .stars { white-space: nowrap; color: var(--butter); letter-spacing: 1px; }
#hud .stars .off { color: #4a5c53; }
#cafe {
  display: block;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 448 / 300;
  image-rendering: pixelated;
  border: 3px solid #0f1814;
  border-radius: 6px;
  background: #000;
  touch-action: none;
  cursor: pointer;
}
#stage { position: relative; }
#talk {
  position: absolute;
  left: 8px; right: 8px; bottom: 8px;
  display: flex;
  gap: 10px;
  background: rgba(24, 36, 31, 0.95);
  border: 3px solid var(--wood);
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
}
#face {
  width: 30%;
  max-width: 132px;
  aspect-ratio: 1;
  flex-shrink: 0;
  align-self: flex-start;
  image-rendering: pixelated;
  background: #e9dcc0;
  border: 3px solid #5a3a22;
  border-radius: 6px;
}
#talk .msg { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; position: relative; }
#talk .who { color: var(--butter); font-size: 14px; }
#talk p { margin: 0; font-size: 16px; line-height: 1.6; min-height: 4.8em; }
#talk .next { position: absolute; right: 2px; bottom: 0; color: var(--butter); animation: blink 0.9s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #talk .next { animation: none; } }
#actions { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
#actions button { font-size: clamp(11px, 3.2vw, 13px); padding: 9px 1px; letter-spacing: -0.5px; }
#actions button.nyaimee { letter-spacing: -1.5px; background: #e8b43a; color: #3a2a10; border-bottom-color: #a07a10; }
#actions button.nyaimee small { color: #5a4010; }
.nya-head { background: #f2c14e; color: #3a2a10; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.nya-head b { font-size: 22px; font-weight: normal; letter-spacing: 1px; }
.nya-head span { font-size: 12px; }
.nya-card { display: grid; grid-template-columns: 56px 1fr auto; gap: 2px 10px; align-items: center; background: #fffaf0; color: #3a2a10; border-radius: 10px; padding: 10px; }
.nya-card canvas { grid-row: 1 / span 4; width: 56px; height: 50px; image-rendering: pixelated; background: #f2e8d4; border-radius: 6px; }
.nya-card .nm { font-size: 17px; }
.nya-card .st { color: #c88a10; font-size: 13px; }
.nya-card .sk { font-size: 12px; display: inline-block; background: #3a7a5a; color: #fff; border-radius: 4px; padding: 1px 6px; justify-self: start; }
.nya-card .tm { font-size: 12px; color: #6a5a40; }
.nya-card button { grid-column: 3; grid-row: 1 / span 4; background: #e8b43a; color: #3a2a10; border-bottom-color: #a07a10; min-width: 84px; }
.nya-card button small { color: #5a4010; }
.nya-card.done { opacity: 0.55; }
#sub .nyax-btn { background: #101418; color: #fff; border-bottom-color: #000; position: relative; flex-shrink: 0; }
.badge { position: absolute; top: -6px; right: -6px; background: #e8483a; color: #fff; font-size: 10px; line-height: 16px; min-width: 16px; padding: 0 4px; border-radius: 8px; }
.nx { display: flex; flex-direction: column; gap: 10px; }
.nx-head { background: #101418; color: #fff; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.nx-head b { font-size: 22px; font-weight: normal; }
.nx-head span { font-size: 12px; color: #9aa4ae; }
.nx-tl { display: flex; flex-direction: column; gap: 1px; background: #2a3238; border-radius: 8px; overflow: hidden; }
.nx-post { display: grid; grid-template-columns: 40px 1fr; gap: 10px; background: #15191d; color: #e8ecef; padding: 10px; }
.nx-post.bad p { color: #ffb0a0; }
.nx-av { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; color: #fff; font-size: 18px; }
.nx-av canvas { width: 40px; height: 40px; image-rendering: pixelated; }
.nx-body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.nx-who { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nx-who b { font-weight: normal; color: #fff; }
.nx-who span { color: #8a949e; font-size: 11px; }
.nx-body p { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-line; }
.nx-body img { width: 100%; max-width: 240px; border-radius: 8px; image-rendering: pixelated; border: 1px solid #2a3238; }
.nx-acts { display: flex; gap: 14px; font-size: 12px; color: #8a949e; flex-wrap: wrap; }
.nx-acts .lk { color: #f2789a; }
.nx-acts .bz { color: #101418; background: #f2c14e; border-radius: 4px; padding: 0 6px; }
.nx-rep { font-size: 12px; color: #b8c0c8; border-left: 2px solid #2a3238; padding-left: 8px; }
.nx-rep b { font-weight: normal; color: #e8ecef; }
button {
  font-family: inherit;
  font-size: 14px;
  color: var(--chalk);
  background: var(--wood);
  border: 0;
  border-bottom: 3px solid #4e321c;
  border-radius: 8px;
  padding: 10px 6px;
  cursor: pointer;
  line-height: 1.25;
}
button:hover { background: var(--wood-hi); }
button:focus-visible { outline: 2px solid var(--butter); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: default; }
button small { display: block; font-size: 11px; color: #e6d3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#actions button { min-width: 0; white-space: nowrap; }
#toast {
  position: fixed;
  left: 0;
  right: 0;
  margin: 0 auto;
  width: fit-content;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  white-space: pre-line;
  line-height: 1.4;
  background: var(--butter);
  color: #2a1e10;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 15px;
  max-width: calc(100% - 32px);
  text-align: center;
  pointer-events: none;
  z-index: 20;
}
#modal {
  position: fixed;
  inset: 0;
  background: rgba(8, 14, 11, 0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 10;
}
.panel {
  background: var(--board-2);
  border: 3px solid var(--wood);
  border-radius: 10px;
  width: min(100%, 480px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  padding: 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.panel > * { flex-shrink: 0; }
.panel h2 { margin: 0; font-size: 22px; font-weight: normal; color: var(--butter); text-wrap: balance; }
.panel p { margin: 0; line-height: 1.6; font-size: 15px; }
.panel .sub { color: var(--chalk-dim); font-size: 13px; }
.tabs { display: flex; gap: 6px; }
.tabs button { flex: 1; background: #3a4d44; border-bottom-color: #26352e; }
.tabs button.on { background: var(--wood); border-bottom-color: #4e321c; }
.list { display: flex; flex-direction: column; gap: 8px; }
.row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 10px;
  align-items: center;
  background: #24352e;
  border-radius: 8px;
  padding: 10px 12px;
}
.row .name { font-size: 16px; }
.row .desc { font-size: 12px; color: var(--chalk-dim); grid-column: 1; min-width: 0; }
.row button { grid-row: 1 / span 2; grid-column: 2; min-width: 84px; }
.catrow { grid-template-columns: 44px 1fr; }
.catrow canvas { grid-row: 1 / span 5; width: 44px; height: 40px; image-rendering: pixelated; }
.row.catrow > :not(canvas) { grid-column: 2; }
.stat { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 15px; font-variant-numeric: tabular-nums; }
.stat .plus { color: var(--butter); text-align: right; }
.stat .minus { color: var(--bad); text-align: right; }
.stat .total { border-top: 1px dashed var(--chalk-dim); padding-top: 6px; }
.review { background: #24352e; border-radius: 8px; padding: 8px 12px; font-size: 14px; line-height: 1.5; }
.review .who { color: var(--butter); font-size: 12px; }
.bar { height: 6px; background: #3a4d44; border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--rose); }
.bar.hunger i { background: var(--butter); }
.actions-row { display: flex; gap: 8px; flex-wrap: wrap; }
.actions-row button { flex: 1; min-width: 120px; }
.kv-wrap { position: relative; border-radius: 8px; overflow: hidden; }
.kv-anim { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.title-art { display: block; width: 100%; height: auto; aspect-ratio: 1248 / 1242; border-radius: 8px; background: #3a2a1c; }
#sub { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--chalk-dim); gap: 8px; }
#sub > span:not(.tools) { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#kitchenCv { display: block; width: 100%; max-width: 100%; aspect-ratio: 448 / 168; image-rendering: pixelated; border: 3px solid #0f1814; border-radius: 6px; touch-action: none; cursor: pointer; background: #f2f4f0; }
#kitchen { display: flex; align-items: center; gap: 8px; min-height: 58px; background: #18241f; border-radius: 8px; padding: 6px 8px; }
#kitchen .klabel { font-size: 11px; color: var(--chalk-dim); writing-mode: vertical-rl; letter-spacing: 2px; flex-shrink: 0; }
#jobs { display: flex; gap: 6px; overflow-x: auto; min-width: 0; flex: 1; }
#jobs:empty::before { content: '注文を受けると ここで調理します'; font-size: 12px; color: #6a7a72; align-self: center; }
.job { flex: 0 0 60px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 4px 4px; background: #2e3f37; border-bottom-width: 2px; border-radius: 6px; }
.job img { width: 24px; height: 24px; image-rendering: pixelated; }
.job .gauge { position: relative; width: 50px; height: 7px; background: #46564e; border-radius: 3px; overflow: hidden; }
.job .gauge .zone { position: absolute; top: 0; bottom: 0; background: #4fbf6a; opacity: 0.85; }
.job .gauge .fill { position: absolute; left: 0; top: 0; bottom: 0; background: #f2c14e; }
.job .gauge .fill.hot { background: #ff8a3a; }
.job .lbl { font-size: 10px; line-height: 1; color: var(--chalk-dim); white-space: nowrap; }
.job.ready { background: #f2c14e; color: #2a1e10; }
.job.ready .lbl { color: #2a1e10; }
.job.ready .gauge .fill { background: #6aa0d8; }
.job.perfect { outline: 2px solid #8affa0; }
.job.wait { opacity: 0.6; }
.tools { display: flex; gap: 6px; flex-shrink: 0; }
.ingr { display: grid; grid-template-columns: 28px 1fr auto auto; gap: 2px 8px; align-items: center; background: #24352e; border-radius: 8px; padding: 8px 10px; }
.ingr img { width: 24px; height: 24px; image-rendering: pixelated; grid-column: 1; grid-row: 1 / span 2; }
.ingr .name { font-size: 15px; grid-column: 2; grid-row: 1; min-width: 0; }
.ingr .desc { font-size: 12px; color: var(--chalk-dim); grid-column: 2; grid-row: 2; min-width: 0; }
.ingr .qty { grid-column: 3; grid-row: 1 / span 2; font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; min-width: 44px; }
.ingr .btns { grid-column: 4; grid-row: 1 / span 2; display: flex; gap: 4px; }
.ingr .btns button { padding: 8px 8px; min-width: 52px; font-size: 13px; }
.tag { display: inline-block; font-size: 11px; padding: 0 5px; border-radius: 4px; margin-left: 4px; vertical-align: 1px; }
.tag.cheap { background: #3f7a4a; color: #e8ffe8; }
.tag.high { background: #8a3a3a; color: #ffe8e8; }
.tag.fresh { background: #3a5a8a; color: #e8f0ff; }
.make { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--chalk-dim); }
.make b { color: var(--chalk); font-weight: normal; }
.make .zero { color: var(--bad); }
#sub button { padding: 4px 10px; font-size: 12px; border-bottom-width: 2px; white-space: nowrap; }
</style>

<script>
'use strict';
// ================= 画面 =================
const VW = 224, VH = 300, S = 4;
const cv = document.getElementById('cafe');
cv.width = VW * S; cv.height = VH * S;
let ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
function P(c, x, y, w = 1, h = 1) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function sprite(rows, pal) {
  const w = Math.max(...rows.map(r => r.length)), c = mk(w, rows.length), g = c.getContext('2d');
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) { const col = pal[r[x]]; if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); } } });
  return c;
}
function flipH(c) { const f = mk(c.width, c.height), g = f.getContext('2d'); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); return f; }
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function ellipse(cx, cy, rx, ry, col) {
  ctx.fillStyle = col;
  for (let y = -ry; y <= ry; y++) {
    const hw = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry + 0.0001))));
    ctx.fillRect(cx - hw, cy + y, hw * 2 + 1, 1);
  }
}

// ================= ドットのしあげ（なめらかなふち・立体感） =================
const MIX_CACHE = new Map();
function mixHex(a, b, t) {
  const key = a + b + t; let r = MIX_CACHE.get(key); if (r) return r;
  r = mixHex0(a, b, t); MIX_CACHE.set(key, r); return r;
}
function mixHex0(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const m = sh => Math.round(((pa >> sh) & 255) * (1 - t) + ((pb >> sh) & 255) * t);
  return '#' + [16, 8, 0].map(sh => m(sh).toString(16).padStart(2, '0')).join('');
}
const isHex = c => typeof c === 'string' && c[0] === '#' && c.length === 7;
// 色の文字列 → RGBA（1回しらべたら とっておく）
const RGBA_CACHE = new Map(), rgbaCv = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
function rgbaOf(col) {
  let v = RGBA_CACHE.get(col);
  if (!v) { rgbaCv.clearRect(0, 0, 1, 1); rgbaCv.fillStyle = col; rgbaCv.fillRect(0, 0, 1, 1); v = rgbaCv.getImageData(0, 0, 1, 1).data.slice(); RGBA_CACHE.set(col, v); }
  return v;
}
// 2次元の色の表を いっきに 描く
function putBuf(g, out, W, H) {
  const im = g.createImageData(W, H), d = im.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const c = out[y][x]; if (!c) continue; const v = rgbaOf(c), i = (y * W + x) * 4; d[i] = v[0]; d[i + 1] = v[1]; d[i + 2] = v[2]; d[i + 3] = v[3]; }
  g.putImageData(im, 0, 0);
}
function polish(buf, W, H, line, { rim = true, despeckle = true } = {}) {
  const at = (x, y) => (y >= 0 && y < H && x >= 0 && x < W) ? buf[y][x] : null;
  const N4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  // 1. 1マスの穴をうめる
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (buf[y][x]) continue;
    let n = 0, first = null;
    for (const [dx, dy] of N4) { const v = at(x + dx, y + dy); if (v) { n++; if (!first) first = v; } }
    if (n >= 3) buf[y][x] = first;
  }
  // 2. まわりと違う色の 1点ノイズをならす
  if (despeckle) {
    const src = buf.map(r => r.slice());
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
      const c = src[y][x]; if (!c) continue;
      const v0 = src[y][x + 1];
      if (v0 && v0 !== c && src[y][x - 1] === v0 && src[y + 1][x] === v0 && src[y - 1][x] === v0) buf[y][x] = v0;
    }
  }
  // 3. 立体感：上と左のふちは少し明るく、下と右のふちは少し暗く
  if (rim) {
    const src = buf.map(r => r.slice());
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const c = src[y][x]; if (!isHex(c)) continue;
      const empty = (dx, dy) => { const v = (y + dy >= 0 && y + dy < H && x + dx >= 0 && x + dx < W) ? src[y + dy][x + dx] : null; return !v; };
      if (empty(0, 1) || empty(1, 0)) buf[y][x] = shade(c, 0.84);
      else if (empty(0, -1) || empty(-1, 0)) buf[y][x] = shade(c, 1.07);

function scale2x(src) {
  const w = src.width, h = src.height, d = src.getContext('2d').getImageData(0, 0, w, h).data;
  const out = mk(w * 2, h * 2), og = out.getContext('2d'), od = og.createImageData(w * 2, h * 2);
  const px = (x, y) => { x = clamp(x, 0, w - 1); y = clamp(y, 0, h - 1); const i = (y * w + x) * 4; return (d[i] << 24 | d[i + 1] << 16 | d[i + 2] << 8 | d[i + 3]) >>> 0; };

  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const E = px(x, y), B = px(x, y - 1), D = px(x - 1, y), F = px(x + 1, y), Hh = px(x, y + 1);
    let e0 = E, e1 = E, e2 = E, e3 = E;
    if (B !== Hh && D !== F) { e0 = D === B ? D : E; e1 = B === F ? F : E; e2 = D === Hh ? D : E; e3 = Hh === F ? F : E; }
    put(x * 2, y * 2, e0); put(x * 2 + 1, y * 2, e1); put(x * 2, y * 2 + 1, e2); put(x * 2 + 1, y * 2 + 1, e3);
  }

  return out;
}

function reviewText(r) {
  if (r.q === 'perfect' && Math.random() < 0.6) return `<div class="review"><span class="who">★★★★★</span><br>「${pick([`${r.item}がおいしすぎる！`, `${r.item}、できたてで さいこう`, 'ここの料理は ほんものだ…'])}」</div>`;
  if (r.q === 'cold' && r.sat < 70) return `<div class="review"><span class="who">★★☆☆☆</span><br>「${r.item}が ちょっと さめてた…」</div>`;
  const good = [`${r.item}がおいしかった！`, `また来たいです。${r.item}さいこう`, 'ゆっくりできました', 'おしゃれで落ち着くお店'];
  const cat = ['ねこが足元に来てくれて しあわせ…', 'ねこがとなりでゴロゴロしてた！', 'ねこと目があった。かわいすぎる'];
  const mid = [`${r.item}はふつうかな`, 'ちょっと待ったけど まあまあ', 'ねこにあいたかったな'];
  const bad = ['ぜんぜん注文が来ない…', 'まちくたびれた', 'ねこの毛がちょっと気になる'];
  const t = r.sat >= 70 ? (r.cat && Math.random() < 0.6 ? pick(cat) : pick(good)) : r.sat >= 45 ? pick(mid) : pick(bad);
  const st = r.sat >= 80 ? 5 : r.sat >= 65 ? 4 : r.sat >= 45 ? 3 : r.sat >= 25 ? 2 : 1;
  return `<div class="review"><span class="who">${'★'.repeat(st)}${'☆'.repeat(5 - st)}</span><br>「${t}」</div>`;
}

// ================= 更新 =================
function update() {
  if (mode !== 'open' && mode !== 'closing') return;
  tick++;
  if (tick % 10 === 0 && G.time < CLOSE) { G.time++; snsTick(); if (G.time >= CLOSE) { mode = 'closing'; toast('閉店時間です。最後のお客さんを見送ろう'); } }
  if (mode === 'open' && --spawnTimer <= 0) {
    spawnCustomer();
    const base = 560 - G.pop * 3.2 - (G.menu.length - 2) * 25 - decor() * 10;
    spawnTimer = Math.round(clamp(base, 140, 620) * rnd(0.7, 1.3) * (weather === 'rain' ? 1.4 : 1) * (G.time < rushUntil ? 0.4 : 1) * (cats.some(k => k.temp && k.skill === 'charm' && k.state !== 'leaving') ? 0.7 : 1) * (1 - Math.min(0.3, (G.sns ? G.sns.followers : 0) / 2500)));
  }
  if (staffBusy > 0) staffBusy--;
  updateJobs(); updatePonta(); updateKitchenFx();
  customers.forEach(updateCustomer);
  customers = customers.filter(c => !c.gone);
  for (const s of seats) if (s.dirty) { s.dirtyT++; if (G.staff && s.dirtyT > 160 && !staffBusy) { s.dirty = false; staffBusy = 30; } }
  cats.forEach(updateCat);
  cats = cats.filter(k => !k.gone);
  for (const p of particles) { p.t++; p.y += p.vy; }
  for (const c of customers) if (c.say && ++c.say.t > 170) c.say = null;
  particles = particles.filter(p => p.t < p.life);
  checkEvents();
  if (mode === 'closing' && customers.length === 0) { seats.forEach(s => { s.dirty = false; }); endDay(); }
}

// ---- 家具を いちど絵にして しあげ処理（ふち・立体感）をかけ、使いまわす
const BAKED = new Map();
function bake(key, x0, y0, w, h, fn) {
  let b = BAKED.get(key);
  if (!b) {
    const c = mk(w, h), g = c.getContext('2d'), keep = ctx;
    g.imageSmoothingEnabled = false; g.translate(-x0, -y0); ctx = g;
    try { fn(); } finally { ctx = keep; }
    const d = g.getImageData(0, 0, w, h).data;
    const hex = v => v.toString(16).padStart(2, '0');
    const buf = Array.from({ length: h }, (_, y) => Array.from({ length: w }, (_, x) => { const i = (y * w + x) * 4; return d[i + 3] > 200 ? '#' + hex(d[i]) + hex(d[i + 1]) + hex(d[i + 2]) : null; }));
    const out = polish(buf, w, h, '#2a1a10', { despeckle: false });
    const oc = mk(w, h), og = oc.getContext('2d');
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (out[y][x]) { og.fillStyle = out[y][x]; og.fillRect(x, y, 1, 1); }
    b = { img: oc, x0, y0 }; BAKED.set(key, b);
  }
  return b;
}
// 基準の位置 (bx, by) で一度だけ描き、あとは ずらして置く
function placeBaked(key, x, y, bx, by, l, t, w, h, raw) {
  const b = bake(key, bx * 2 - l, by * 2 - t, w, h, () => raw(bx, by));
  ctx.drawImage(b.img, Math.round(x * 2 - l), Math.round(y * 2 - t));
}

    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
    for (let i = 0; i <= n; i++) { const x = Math.round(x0 + (x1 - x0) * i / n), y = Math.round(y0 + (y1 - y0) * i / n); if (x >= 0 && x < N && y >= 0 && y < N) out[y][x] = '#fffaf0'; }
  });

  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (out[y][x]) { g.fillStyle = out[y][x]; g.fillRect(x, y, 1, 1); }

      if (p.replies.length < 4 && Math.random() < gain * 0.04) p.replies.push({ name: pick(SNS_NAMES), text: pick(REPLIES) });

function grioDailyPost(day, log) {
  const sns = snsState();
  const names = cats.filter(k => !k.temp && k.pal !== 'grio').map(k => k.name);
  const parts = [`${day}日目、おしまいだにゃ。お客さん ${log.served}人 来てくれたにゃ。ありがとう！`];
  const extra = [];
  if ((log.perfect || 0) >= 3) extra.push(`きょうは パーフェクトな 料理を ${log.perfect}回 つくれたにゃ`);
  if (log.newCat) extra.push(`あたらしい なかまの ${log.newCat}が 来たにゃ。よろしくね`);
  if (log.pontaNaps) extra.push(`ぽんたは きょうも ${log.pontaNaps}回 ねてたにゃ…`);
  if (log.nyaimee) extra.push('ニャイミーの ねこさんが 手伝ってくれたにゃ');
  if (weather === 'rain') extra.push('雨の中 来てくれた お客さん、ありがとにゃ');
  if (log.angry) extra.push('おまたせしちゃった お客さん、ごめんにゃ…');
  const best = log.reviews.filter(r => r.sat >= 80 && r.item)[0];
  if (best) extra.push(`「${best.item}が おいしかった」って 言ってもらえたにゃ`);
  if (names.length) extra.push(`${pick(names)}も がんばったにゃ`);
  parts.push(...extra.sort(() => Math.random() - 0.5).slice(0, 2));
  const text = parts.join('\n') + '\n#ねこカフェ #ぐりおのねこカフェ';
  render();
  let target = 4 + sns.followers * 0.12 + G.pop * 0.25 + log.served * 0.8 + (log.perfect || 0) * 1.5;
  target *= 1.4 + Math.min(0.6, cats.length * 0.1);
  if (log.newCat) target *= 1.5;
  let luck = rnd(0.6, 1.6); if (Math.random() < 0.07) luck *= 6;
  target = Math.max(1, Math.round(target * luck));

  return post;
}

let last = performance.now(), acc = 0, hudT = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) {
    if (!isPaused()) for (let i = 0; i < speed; i++) update();
    acc -= 1000 / 60;
  }
  if (!talking && talkQ.length && $('modal').hidden) startTalk();
  render(); renderKitchen(); warmSprites();
  if (++hudT % 10 === 0) updateHud();
  requestAnimationFrame(loop);
}

// 店内は横幅いっぱい。操作ドックを残してページをスクロールする。
function fitLayout() {
  const wrap = $('wrap'), vv = window.visualViewport, bs = getComputedStyle(document.body);
  const width = vv ? vv.width : innerWidth;
  const px = parseFloat(bs.paddingLeft) + parseFloat(bs.paddingRight);
  wrap.style.width = Math.floor(Math.min(width - px, 640)) + 'px';
  wrap.style.height = 'auto';
  // Never shrink the game to fit a short viewport. The page scrolls and
  // the action dock stays visible; the cafe uses the full available width.
  const sceneWidth = wrap.clientWidth;
  cv.style.width = sceneWidth + 'px';
  cv.style.height = Math.floor(sceneWidth * VH / VW / 2) + 'px';
  // The game renders on a 448x600 pixel-art grid. Use an integer backing
  // multiplier that covers the physical display, without inventing sprite detail.
  const raster = Math.max(1, Math.ceil(sceneWidth * (window.devicePixelRatio || 1) / FW));
  const bw = FW * raster, bh = FH / 2 * raster;
  if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
  const kr = Math.max(1, Math.ceil(kcv.clientWidth * (window.devicePixelRatio || 1) / KW));
  if (kcv.width !== KW * kr || kcv.height !== KH * kr) { kcv.width = KW * kr; kcv.height = KH * kr; }
  positionDialogue();
}
function positionDialogue() {
  const top = $('dock').getBoundingClientRect().top;
  document.documentElement.style.setProperty('--talk-bottom', Math.max(12, innerHeight - top + 12) + 'px');
}
