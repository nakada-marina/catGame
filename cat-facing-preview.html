<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ねこの前向きと後ろ向き</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#1f2e28;color:#efe9dc}
body{max-width:900px;margin:auto;padding:24px 16px}
h1{font-size:24px;margin:0 0 12px}
p{line-height:1.7}
a{color:#f2c14e}
button{font:inherit;padding:8px 14px;border:1px solid #a9b8ad;border-radius:6px;background:#2a3d35;color:inherit;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:20px}
article{background:#2a3d35;border:1px solid #506150;border-radius:10px;padding:16px}
h2{text-align:center;font-size:18px;margin:0 0 12px}
.views{display:grid;grid-template-columns:1fr 1fr;gap:12px}
figure{margin:0;text-align:center}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#e9dcc0;border-radius:6px}
figcaption{padding-top:8px;font-size:14px}
</style>
</head>
<body>
<h1>ねこの前向きと後ろ向き</h1>
<p>同じねこの前向き・後ろ向きを、ゲーム内の大きさで並べて見られます。</p>
<button id="toggle" type="button">歩行を止める</button>
<p><a href="./">ゲームへ戻る</a> · <a href="./animation-preview.html">ぐりお・ぽんたの全モーション</a></p>
<p id="status" role="status">素材を読み込んでいます…</p>
<div class="grid" id="cats"></div>
<script src="./character-art.js?v=20261011-motion-scale"></script>
<script src="./rear-walk.js?v=20261011-motion-scale"></script>
<script>
(async function(){
  try {
    await RearWalk.load;
    document.getElementById('status').hidden=true;
    const actors=[['grio','ぐりお'],['ponta','ぽんた'],['mike','みけ'],['kuro','くろ'],['shiro','しろ'],['chacha','ちゃちゃ']];
    const views=[],source={width:128,height:144};
    for(const [pal,name] of actors){
      const article=document.createElement('article'),h=document.createElement('h2'),group=document.createElement('div');
      h.textContent=name;group.className='views';article.append(h,group);
      for(const [facing,label] of [['front','前向き'],['back','後ろ向き']]){
        const figure=document.createElement('figure'),cv=document.createElement('canvas'),caption=document.createElement('figcaption');
        cv.width=128;cv.height=144;cv.setAttribute('aria-label',name+'の'+label);caption.textContent=label;
        figure.append(cv,caption);group.append(figure);views.push({pal,facing,cv});
      }
      document.getElementById('cats').append(article);
    }
    let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,frame=0,last=0;
    const button=document.getElementById('toggle');
    function label(){button.textContent=paused?'歩行を再生する':'歩行を止める';}
    function draw(){for(const {pal,facing,cv} of views){const g=cv.getContext('2d');g.clearRect(0,0,128,144);g.imageSmoothingEnabled=false;const model=(pal==='grio'||pal==='ponta')?source:{width:76,height:53},im=RearWalk.cat(pal,frame,model,null,facing),size=CatArtwork.displaySize(pal,im);g.drawImage(im,Math.round((128-size.width)/2),144-size.height,size.width,size.height);}}
    button.onclick=()=>{paused=!paused;label();};label();draw();
    function animate(time){if(!paused&&time-last>=150){frame=(frame+1)%4;last=time;draw();}requestAnimationFrame(animate);}
    requestAnimationFrame(animate);
  } catch(error) {document.getElementById('status').textContent='素材を読み込めませんでした。再読み込みしてください。';}
})();
</script>
</body>
</html>
